<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ReadyAt • T10F</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReadyAt">
  <meta name="theme-color" content="#030407">

  <link id="dynamicAppleIcon" rel="apple-touch-icon" sizes="180x180">
  <link id="dynamicFavicon" rel="icon" type="image/png">

  <script>
    /* ReadyAt • Birleşik uygulama ikonu (mavi + turuncu) ve manifest */
    (function generateAppAssets() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createRadialGradient(256, 256, 50, 256, 256, 320);
      bgGrad.addColorStop(0, '#151c28');
      bgGrad.addColorStop(0.6, '#080a0f');
      bgGrad.addColorStop(1, '#020305');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 512);

      const arcGrad = ctx.createLinearGradient(120, 80, 420, 440);
      arcGrad.addColorStop(0, '#0a84ff');
      arcGrad.addColorStop(1, '#5ac8fa');
      const boltGrad = ctx.createLinearGradient(210, 165, 312, 355);
      boltGrad.addColorStop(0, '#ffb340');
      boltGrad.addColorStop(1, '#ff9f0a');

      ctx.lineWidth = 28;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath(); ctx.arc(256, 256, 160, 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = arcGrad;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#0a84ff';
      ctx.shadowBlur = 24;
      ctx.beginPath(); ctx.arc(256, 256, 160, -Math.PI / 2, Math.PI * 0.82); ctx.stroke();

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(256, 92); ctx.lineTo(256, 126); ctx.stroke();

      ctx.fillStyle = boltGrad;
      ctx.shadowColor = '#ff9f0a';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.moveTo(274, 165); ctx.lineTo(210, 270); ctx.lineTo(262, 270);
      ctx.lineTo(238, 355); ctx.lineTo(312, 246); ctx.lineTo(262, 246);
      ctx.closePath(); ctx.fill();

      const pngUri = canvas.toDataURL('image/png');
      document.getElementById('dynamicAppleIcon').href = pngUri;
      document.getElementById('dynamicFavicon').href = pngUri;

      try {
        const manifestObj = {
          name: "ReadyAt T10F", short_name: "ReadyAt",
          start_url: window.location.href, display: "standalone",
          background_color: "#030407", theme_color: "#030407",
          icons: [{ src: pngUri, sizes: "512x512", type: "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg-base: #030407;
      --ios-blue: #0a84ff;
      --ios-cyan: #5ac8fa;
      --ios-orange: #ff9f0a;
      --ios-amber: #ffb340;
      --text-primary: #ffffff;
      --text-secondary: #9ea4b4;
      --card-border: rgba(255, 255, 255, 0.14);
      --card-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --shift: min(15vh, 96px);
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    }

    html { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
    body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
    html, body {
      background: var(--bg-base);
      color: var(--text-primary);
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ===== UYGULAMA ÇERÇEVELERİ (orijinal AC / DC kodları) ===== */
    .app-frame {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      border: 0; background: var(--bg-base);
      opacity: 0; visibility: hidden; z-index: 1;
      transition: opacity 0.45s ease, visibility 0s linear 0.45s;
    }
    .app-frame.on {
      opacity: 1; visibility: visible; z-index: 2;
      transition: opacity 0.45s ease, visibility 0s;
    }

    /* ===== ORTAK MOD DÜĞMELERİ (AC / DC) ===== */
    .mode-btn {
      -webkit-appearance: none; appearance: none;
      width: 86px; height: 86px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 800; letter-spacing: 0.5px;
      cursor: pointer; position: relative;
      border: 1px solid var(--bc);
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 10px 28px rgba(0,0,0,0.5), var(--card-highlight);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease),
                  background 0.3s ease, opacity 0.45s ease, border-color 0.3s ease;
    }
    .mode-btn:active { transform: scale(0.92); }
    .mode-btn.ac {
      --fg: var(--ios-cyan); --bc: rgba(10,132,255,0.42);
      --bg: radial-gradient(circle at 30% 25%, rgba(10,132,255,0.24), rgba(10,132,255,0.07));
      --glow: rgba(10,132,255,0.55);
    }
    .mode-btn.dc {
      --fg: var(--ios-orange); --bc: rgba(255,159,10,0.42);
      --bg: radial-gradient(circle at 30% 25%, rgba(255,159,10,0.24), rgba(255,159,10,0.07));
      --glow: rgba(255,159,10,0.55);
    }
    @media (hover: hover) {
      .mode-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 26px var(--glow), var(--card-highlight); }
    }

    /* ===== AÇILIŞ SAHNESİ ===== */
    .stage {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 20;
      background: var(--bg-base);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: opacity 0.7s ease, visibility 0s linear 0.7s;
    }
    .stage.gone { opacity: 0; visibility: hidden; pointer-events: none; }

    .stage-glow {
      position: absolute; width: 520px; height: 520px; border-radius: 50%;
      filter: blur(90px); pointer-events: none; opacity: 0;
      animation: glowIn 2.2s 0.2s ease forwards;
    }
    .stage-glow.g-blue {
      top: -14%; left: -28%;
      background: radial-gradient(circle, rgba(10,132,255,0.30), rgba(10,132,255,0) 70%);
    }
    .stage-glow.g-orange {
      bottom: -16%; right: -30%;
      background: radial-gradient(circle, rgba(255,159,10,0.26), rgba(255,159,10,0) 70%);
    }
    @keyframes glowIn { to { opacity: 1; } }

    .stage-brand {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      position: relative; z-index: 2;
      transition: transform 1.15s var(--ease);
    }
    .stage.ready .stage-brand { transform: translateY(calc(var(--shift) * -1)); }

    .logo-box { width: 110px; height: 110px; position: relative; }

    .logo-arc {
      stroke-dasharray: 900; stroke-dashoffset: 900;
      animation: chargeArcFill 1.35s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
    }
    @keyframes chargeArcFill { 0% { stroke-dashoffset: 900; } 100% { stroke-dashoffset: 0; } }

    .logo-bolt {
      opacity: 0; transform-origin: center;
      animation: boltPowerUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes boltPowerUp {
      0%   { opacity: 0; transform: scale(0.85); }
      40%  { opacity: 0.3; }
      80%  { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(255,159,10,0.9)); }
      100% { opacity: 1; transform: scale(1);    filter: drop-shadow(0 0 8px rgba(255,159,10,0.6)); }
    }
    .logo-ring-glow { filter: drop-shadow(0 0 10px rgba(10,132,255,0.55)); }

    .stage-title {
      font-size: 26px; font-weight: 800; letter-spacing: -0.6px; color: #fff;
      display: flex; align-items: center; gap: 7px;
      opacity: 0; animation: fadeInText 0.8s 0.3s forwards ease-out;
    }
    @keyframes fadeInText { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .stage-badge {
      font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
      color: #d6dbe8; padding: 2px 7px; border-radius: 7px;
      background: linear-gradient(120deg, rgba(10,132,255,0.28), rgba(255,159,10,0.28));
      border: 1px solid rgba(255,255,255,0.2);
    }

    .stage-choices {
      position: absolute; left: 0; right: 0;
      top: calc(50% + 34px);
      display: flex; justify-content: center; gap: 26px;
      z-index: 2; pointer-events: none;
    }
    .stage-choices .mode-btn {
      opacity: 0; transform: translateY(16px) scale(0.94); filter: blur(6px);
      transition: opacity 0.9s var(--ease), transform 0.9s var(--ease), filter 0.9s var(--ease),
                  box-shadow 0.35s var(--ease), background 0.3s ease;
    }
    .stage.ready .stage-choices { pointer-events: auto; }
    .stage.ready .stage-choices .mode-btn { opacity: 1; transform: none; filter: none; }
    .stage.ready .stage-choices .mode-btn.ac { transition-delay: 0.5s, 0.5s, 0.5s, 0s, 0s; }
    .stage.ready .stage-choices .mode-btn.dc { transition-delay: 0.68s, 0.68s, 0.68s, 0s, 0s; }
    .stage.ready .stage-choices .mode-btn:active { transform: scale(0.92); transition-delay: 0s; }

    /* seçim anı */
    .stage.picked .stage-choices { pointer-events: none; }
    .stage.picked .stage-choices .mode-btn { transition-delay: 0s !important; }
    .stage.picked .stage-choices .mode-btn.other { opacity: 0; transform: scale(0.8); }
    .stage.picked .stage-choices .mode-btn.chosen {
      transform: scale(1.1); box-shadow: 0 0 34px var(--glow), var(--card-highlight);
    }

    /* ===== MOD DEĞİŞTİRME POP-UP ===== */
    .switcher {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: rgba(3,4,7,0.55);
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
      opacity: 0; visibility: hidden;
      transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    }
    .switcher.open { opacity: 1; visibility: visible; transition: opacity 0.35s ease, visibility 0s; }

    .switcher-card {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 22px 26px 26px;
      border-radius: 34px;
      background: rgba(18,22,32,0.78);
      border: 0.5px solid var(--card-border);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6), var(--card-highlight);
      backdrop-filter: blur(32px) saturate(200%); -webkit-backdrop-filter: blur(32px) saturate(200%);
      transform: translateY(14px) scale(0.94);
      transition: transform 0.5s var(--ease);
    }
    .switcher.open .switcher-card { transform: none; }

    .switcher-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.4px;
      text-transform: uppercase; color: var(--text-secondary);
    }
    .switcher-row { display: flex; gap: 22px; }
    .switcher .mode-btn { width: 78px; height: 78px; font-size: 24px; }
    .switcher .mode-btn.current {
      box-shadow: 0 0 26px var(--glow), var(--card-highlight);
      border-color: var(--fg);
    }
    .switcher .mode-btn:not(.current) { opacity: 0.55; }
    .switcher .mode-btn:not(.current):active, .switcher .mode-btn.loading { opacity: 1; }
    .switcher .mode-btn.loading { animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
</head>
<body>

  <!-- Orijinal AC / DC uygulamaları buraya yüklenir -->
  <iframe class="app-frame" id="frame-ac" title="ReadyAt AC" allow="geolocation *; clipboard-write *; fullscreen *"></iframe>
  <iframe class="app-frame" id="frame-dc" title="ReadyAt DC" allow="geolocation *; clipboard-write *; fullscreen *"></iframe>

  <!-- Mod değiştirme pop-up -->
  <div class="switcher" id="switcher">
    <div class="switcher-card">
      <div class="switcher-label">Şarj Modu</div>
      <div class="switcher-row">
        <button class="mode-btn ac" data-mode="ac" type="button" aria-label="AC">AC</button>
        <button class="mode-btn dc" data-mode="dc" type="button" aria-label="DC">DC</button>
      </div>
    </div>
  </div>

  <!-- Açılış sahnesi -->
  <div class="stage" id="stage">
    <div class="stage-glow g-blue"></div>
    <div class="stage-glow g-orange"></div>

    <div class="stage-brand">
      <div class="logo-box">
        <svg viewBox="0 0 512 512" width="100%" height="100%">
          <defs>
            <linearGradient id="stArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0a84ff" />
              <stop offset="100%" stop-color="#5ac8fa" />
            </linearGradient>
            <linearGradient id="stBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffb340" />
              <stop offset="100%" stop-color="#ff9f0a" />
            </linearGradient>
          </defs>
          <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="26" />
          <g class="logo-ring-glow">
            <path class="logo-arc" d="M 256,96 A 160,160 0 1,1 117,336" fill="none" stroke="url(#stArcGrad)" stroke-width="26" stroke-linecap="round" />
          </g>
          <line x1="256" y1="96" x2="256" y2="128" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
          <path class="logo-bolt" d="M 274,165 L 210,270 L 262,270 L 238,355 L 312,246 L 262,246 Z" fill="url(#stBoltGrad)" />
        </svg>
      </div>
      <div class="stage-title">
        <span>ReadyAt</span>
        <span class="stage-badge">T10F</span>
      </div>
    </div>

    <div class="stage-choices">
      <button class="mode-btn ac" data-mode="ac" type="button" aria-label="AC">AC</button>
      <button class="mode-btn dc" data-mode="dc" type="button" aria-label="DC">DC</button>
    </div>
  </div>

    }

    .conditions-summary {
      font-size: 11px;
      color: var(--text-secondary);
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .ios-chips-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .ios-chip-btn {
      background: var(--bg-card-secondary);
      border: 1.5px solid transparent;
      border-radius: 13px;
      padding: 11px 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .ios-chip-btn svg { opacity: 0.65; }

    .ios-chip-btn.active {
      background: var(--bg-card-tertiary);
      border-color: rgba(90, 200, 250, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .ios-chip-btn.active svg {
      opacity: 1;
      color: var(--ios-cyan);
    }

    .modal-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card-secondary);
      border: 0.5px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: background 0.15s ease;
    }

    .modal-toggle-row:active {
      background: var(--bg-card-tertiary);
    }

    .modal-toggle-row .info-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .modal-toggle-row .row-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .modal-toggle-row .row-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .toggle-badge-val {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ios-cyan);
      background: rgba(10, 132, 255, 0.18);
      border: 1px solid rgba(10, 132, 255, 0.35);
      padding: 4px 10px;
      border-radius: 9px;
    }

    .stats-quad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      flex-shrink: 0;
    }

    .stat-box-k {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-box-v {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .footer-text {
      text-align: center;
      padding: 2px 12px 0px;
      font-size: 10.5px;
      line-height: 1.4;
      color: var(--text-tertiary);
      font-weight: 500;
      flex-shrink: 0;
    }

    .ios-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .ios-modal-backdrop.open { display: flex; }

    .ios-modal-card {
      width: 100%;
      max-width: 420px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 28px 28px 0 0;
      padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(16, 20, 30, 0.94);
      border: 0.5px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .modal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title { font-size: 18px; font-weight: 800; color: #fff; }
    
    .btn-info-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ios-cyan);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .info-card-box {
      display: none;
      background: rgba(12, 16, 24, 0.96);
      border: 1px solid rgba(10, 132, 255, 0.35);
      border-radius: 16px;
      padding: 14px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #e5e5ea;
    }

    .info-card-box.open { display: block; }
    .info-card-box strong { color: var(--ios-cyan); }
    .info-card-box ul { padding-left: 18px; margin-top: 6px; }

    .form-row { display: flex; flex-direction: column; gap: 5px; }
    .form-row label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }

    .ios-select, .ios-input {
      background: var(--bg-card-secondary);
      border: 0.5px solid var(--card-border);
      border-radius: 13px;
      padding: 11px 14px;
      color: #fff;
      font-size: 14.5px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .logbook-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      margin-top: 4px;
    }

    .logbook-item {
      background: var(--bg-card-secondary);
      border: 0.5px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .logbook-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #ffffff;
    }

    .logbook-sub {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 11px;
    }

    .logbook-empty {
      text-align: center;
      padding: 18px 0;
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 500;
    }

    .legal-disclaimer-card {
      background: rgba(0, 0, 0, 0.5);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 10.5px;
      color: var(--text-tertiary);
      line-height: 1.4;
      text-align: justify;
    }

    .confirm-spec-box {
      background: var(--bg-card-secondary);
      border: 0.5px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .confirm-spec-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
    }

    .confirm-spec-row span { color: var(--text-secondary); font-weight: 500; }
    .confirm-spec-row strong { color: #fff; font-weight: 700; }

    .ios-toast {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(28, 34, 48, 0.96);
      border: 0.5px solid var(--card-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      color: #ffffff;
      padding: 11px 20px;
      border-radius: 22px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ios-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    input, select, textarea { -webkit-user-select: text; user-select: text; }
    .ios-time-field:disabled, #sliderManualAmp:disabled, .segment-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    @media (max-width: 360px) {
      .header-center-crest { display: none; }
      .nav-header { grid-template-columns: minmax(0, 1fr) auto; }
      .weather-capsule { font-size: 10.5px; padding: 5px 7px; max-width: 108px; }
      .ios-time-field { font-size: 15px; }
      .header-ac-subbadge { display: none; }
      .time-input-meta span { font-size: 9.5px; }
      .app-viewport { padding: 6px 10px 14px; gap: 7px; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientAura"></div>
  <div class="ios-toast" id="iosToast">İşlem Başarılı</div>

  <label style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;">
    <input type="checkbox" id="iosHapticTrigger">
  </label>

  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo-box">
      <svg viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a84ff" />
            <stop offset="50%" stop-color="#5ac8fa" />
            <stop offset="100%" stop-color="#30d158" />
          </linearGradient>
        </defs>
        <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="26" />
        <path class="splash-arc-fill" d="M 256,96 A 160,160 0 1,1 117,336" fill="none" stroke="url(#splashGrad)" stroke-width="26" stroke-linecap="round" />
        <line x1="256" y1="96" x2="256" y2="128" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
        <path class="splash-bolt-glow" d="M 274,165 L 210,270 L 262,270 L 238,355 L 312,246 L 262,246 Z" fill="url(#splashGrad)" />
      </svg>
    </div>
    <div class="splash-title">
      <span>ReadyAt</span>
      <span class="splash-ac-badge">T10F</span>
    </div>
  </div>

  <div class="app-viewport">
    
    <header class="nav-header">
      <div class="brand-stack">
        <div class="app-icon-badge">
          <svg viewBox="0 0 512 512" width="24" height="24">
            <defs>
              <linearGradient id="navBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#007aff" />
                <stop offset="50%" stop-color="#5ac8fa" />
                <stop offset="100%" stop-color="#30d158" />
              </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="28" />
            <path d="M 256,96 A 160,160 0 1,1 117,336" fill="none" stroke="url(#navBrandGrad)" stroke-width="28" stroke-linecap="round" />
            <line x1="256" y1="96" x2="256" y2="126" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
            <path d="M 274,165 L 210,270 L 262,270 L 238,355 L 312,246 L 262,246 Z" fill="url(#navBrandGrad)" />
          </svg>
        </div>
        <div class="brand-texts">
          <div class="brand-title-row">
            <span class="brand-title">ReadyAt</span>
            <span class="header-ac-subbadge">T10F</span>
          </div>
          <span class="brand-sub">89.6 kWh LFP &bull; 11 kW</span>
        </div>
      </div>

      <@!-- TEPE ORTA: TOGG BİREBİR AMBLEMİ (ORİJİNAL ÇİFT CHEVRON) -->
      <div class="header-center-crest" id="btnHeaderCrest" title="Togg T10F Long Range">
        <div class="togg-vector-emblem">
          <svg width="48" height="27" viewBox="0 0 160 90" fill="currentColor">
            <polygon points="80,0 0,45 80,90 40,45" />
            <polygon points="80,0 160,45 80,90 120,45" />
          </svg>
        </div>
        <span class="crest-tag-abg">ABG</span>
      </div>

      <div class="nav-actions">
        <div class="weather-capsule" id="weatherDisplay">
          <span id="weatherIconContainer" style="display:flex; align-items:center; color:var(--ios-cyan);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </span>
          <span id="weatherText">--°C</span>
        </div>
        <button class="icon-btn-plain" id="btnSettings" title="Ayarlar & Günlük">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="segmented-control">
      <button class="segment-btn active" id="tabTargetTime">Hedef Saat &rarr; Akım</button>
      <button class="segment-btn" id="tabFixedAmp">Sabit Akım &rarr; Saat</button>
    </div>

    <@!-- Sabit Yükseklikli Hero Panel -->
    <div class="hero-panel">
      <span class="hero-eyebrow" id="heroLabel">ÖNERİLEN AKIM</span>
      <div class="hero-big-val">
        <span class="odometer-digit" id="heroMainValue">--</span>
        <span class="unit" id="heroUnit">A</span>
      </div>

      <div class="countdown-pill" id="liveCountdownPill">0 sa 00 dk kaldı</div>

      <div class="hero-status-row">
        <span id="badgeIntel" class="ios-tag intel">Gece Dolumu</span>
        <span id="badgeEarly" class="ios-tag orange" style="display: none;">Erken Bitiş</span>
        <span id="badgeHeat" class="ios-tag blue" style="display: none;">Isıtıcı Aktif</span>
        <span id="badgePrecon" class="ios-tag orange" style="display: none;">Klima Aktif</span>
        <span id="badgeCv" class="ios-tag blue" style="display: none;">Dengeleme (+35d)</span>
      </div>

      <p class="hero-caption" id="heroSubDesc">Hesaplanıyor...</p>
    </div>

    <@!-- BATARYA KARTI -->
    <div class="touch-battery-card ios-glass-card" id="batteryCardContainer">
      <div class="battery-header-row">
        <span class="bat-title-mode" id="txtLivePhaseMode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="9" r="7"/><path d="M12 6v6l4 2"/></svg>
          <span>Beklemede</span>
        </span>
        <span class="bat-sub-detail" id="txtBatDeltaSummary">+60% &bull; 51.5 kWh</span>
      </div>

      <div class="master-touch-tube-wrap">
        <div class="tube-float-hud" id="tubeFloatHud">%--</div>
        <div class="master-touch-tube" id="masterTouchTube">
          <div class="specular-glare" id="specularGlare"></div>
          <div class="tube-start-fill" id="tubeStartFill"></div>
          <div class="tube-target-window" id="tubeTargetWindow"></div>
          <div class="tube-live-fill" id="tubeLiveFill"></div>
          
          <div class="tube-inner-readout">
            <div class="tube-tag-block">
              <span class="tube-tag-label">Mevcut</span>
              <span class="tube-tag-val" id="dispCurrentSoc">%20</span>
            </div>
            <div class="tube-tag-block" style="text-align: right;">
              <span class="tube-tag-label">Hedef</span>
              <span class="tube-tag-val" id="dispTargetSoc">%80</span>
            </div>
          </div>
        </div>
      </div>
      <span class="tube-guide-hint">Bara dokunarak veya sürükleyerek seviyeleri belirleyin</span>
    </div>

    <@!-- ZAMAN PLANI KARTI -->
    <div id="panelTargetTime" class="ios-card ios-glass-card">
      <div class="ios-card-header">
        <span class="ios-section-label">Zaman Planı</span>
        <span class="ios-section-badge" id="chargingWindowTag">-- sa -- dk</span>
      </div>

      <div class="ios-time-grid">
        <div class="ios-time-input-box">
          <div class="time-input-meta">
            <span>Başlat</span>
            <span class="time-now-link" id="btnSetNow">Şimdi</span>
          </div>
          <input type="time" id="inputStartTime" class="ios-time-field">
        </div>

        <div class="ios-time-input-box">
          <div class="time-input-meta">
            <span>Ayrılış Saati</span>
            <span style="color: var(--text-secondary);">HEDEF</span>
          </div>
          <input type="time" id="inputTargetTime" class="ios-time-field" value="07:30">
        </div>
      </div>

      <div class="ios-rec-grid">
        <div class="ios-rec-cell selected" id="recTriCard">
          <div class="cell-selected-badge">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="cell-title">Trifaze (3-Faz)</span>
          <span class="cell-amp" id="recTriAmp">-- A</span>
          <span class="cell-sub" id="recTriDetail">10.8 kW</span>
          <span class="cell-alert" id="recTriEarly"></span>
        </div>
        <div class="ios-rec-cell" id="recMonoCard">
          <div class="cell-selected-badge">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="cell-title">Monofaze (1-Faz)</span>
          <span class="cell-amp" id="recMonoAmp">-- A</span>
          <span class="cell-sub" id="recMonoDetail">-- kW</span>
          <span class="cell-alert" id="recMonoEarly"></span>
        </div>
      </div>
    </div>

    <@!-- SABİT AKIM KARTI -->
    <div id="panelFixedAmp" class="ios-card ios-glass-card" style="display: none;">
      <div class="ios-card-header">
        <span class="ios-section-label">Akım &amp; Faz Seçimi</span>
        <span class="ios-section-badge" id="fixedPowerTag">10.8 kW</span>
      </div>

      <div class="ios-time-input-box">
        <div class="time-input-meta">
          <span>Başlatma Saati</span>
          <span class="time-now-link" id="btnSetNow2">Şimdi</span>
        </div>
        <input type="time" id="inputStartTime2" class="ios-time-field">
      </div>

      <div class="segmented-control">
        <button class="segment-btn active" id="btnPhase3">Trifaze (3-Faz)</button>
        <button class="segment-btn" id="btnPhase1">Monofaze (1-Faz)</button>
      </div>

      <div class="form-row" style="padding-top: 3px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-secondary);">
          <span>Akım Limiti</span>
          <strong id="dispManualAmp" style="color: #fff;">16A</strong>
        </div>
        <input type="range" id="sliderManualAmp" min="6" max="16" value="16">
      </div>
    </div>

    <@!-- ŞARJI BAŞLAT BUTONU -->
    <button class="btn-ios-primary" id="btnTriggerStartFlow">
      <svg id="btnStartIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <span id="btnStartText">ŞARJI BAŞLAT</span>
    </button>

    <@!-- KOŞULLAR BUTONU -->
    <div class="conditions-trigger-bar ios-glass-card" id="btnOpenConditionsModal">
      <div class="conditions-left">
        <span class="conditions-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/></svg>
        </span>
        <span class="conditions-title">Koşullar &amp; Hafıza</span>
      </div>
      <span class="conditions-summary" id="conditionsSummaryTag">Soğuk • Kış: Oto</span>
    </div>

    <@!-- İSTATİSTİKLER -->
    <div class="stats-quad ios-glass-card">
      <div>
        <div class="stat-box-k">Şebeke</div>
        <div class="stat-box-v" id="statEnergy">-- kWh</div>
      </div>
      <div>
        <div class="stat-box-k">Güç</div>
        <div class="stat-box-v" id="statPower">-- kW</div>
      </div>
      <div>
        <div class="stat-box-k">Net Verim</div>
        <div class="stat-box-v" id="statEff">%--</div>
      </div>
      <div>
        <div class="stat-box-k">Tutar</div>
        <div class="stat-box-v" id="statCost" style="color: var(--ios-green);">-- ₺</div>
      </div>
    </div>

    <div class="footer-text">
      Togg T10F V2 Long Range • ReadyAt Özel İkiz Simülasyonu
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'readyat_settings_t10f_abg_v1';
    const CACHED_WEATHER_KEY = 'readyat_cached_weather_v2';
    const LOGBOOK_STORAGE_KEY = 'readyat_t10f_logbook_v1';

    const VEHICLE_PARASITIC_KW = 0.18;
    const ZES_DEFAULT_AC_PRICE = 10.99;
    const CALIB_MIN = 0.75;
    const CALIB_MAX = 1.25;
    const T10F_USABLE_KWH = 85.8;
    const T10F_GROSS_KWH = 89.6;
    const T10F_OBC_KW = 11.0;

    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function clampNum(v, min, max, def) {
      const n = Number(v);
      return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
    }
    function clampCalib(v) { return Math.max(CALIB_MIN, Math.min(CALIB_MAX, v)); }

    const TURKEY_GEO = {
      "Eskişehir": { lat: 39.7767, lon: 30.5206 },
      "Ankara": { lat: 39.9334, lon: 32.8597 },
      "İstanbul": { lat: 41.0082, lon: 28.9784 },
      "İzmir": { lat: 38.4192, lon: 27.1287 },
      "Bursa": { lat: 40.1885, lon: 29.0610 },
      "Antalya": { lat: 36.8969, lon: 30.7133 },
      "Muğla": { lat: 37.2153, lon: 28.3636 }
    };

    const BALANCE_MODES = [
      { id: 'worst', label: '>1 Ay (35d)', mins: 35 },
      { id: 'fresh', label: '1-2 Gün (10d)', mins: 10 },
      { id: 'week1', label: '~1 Hft (18d)', mins: 18 },
      { id: 'week3', label: '2-3 Hft (25d)', mins: 25 }
    ];

    let state = {
      province: 'Eskişehir',
      calibFactor: 0.95,
      electricityRate: ZES_DEFAULT_AC_PRICE,
      tripProfile: 'cold',
      winterMode: 'auto',
      preconMode: false,
      balanceTierIndex: 0,
      lastFullChargeDate: null,
      balanceUserOverridden: false,
      notifyActive: false,
      tab: 'targetTime',
      targetPhaseChoice: 3,
      currentSoc: 20,
      targetSoc: 80,
      manualPhase: 3,
      manualAmp: 16,
      startTime: '',
      startManual: false,
      targetTime: '07:30',
      isChargingActive: false,
      activeSession: null
    };

    let logbook = [];
    let currentAmbientTemp = 18;
    let weatherAvailable = false;
    let heroTimer = null;
    let toastTimer = null;
    let hourlyForecastList = [];
    let lastHapticValue = null;
    let lastDisplayedHeroValue = null;
    let currentLogMode = null;

    let lastCalculatedPrediction = {
      predictedFinishStr: '--:--',
      finishDate: null,
      totalChargingMins: 0,
      heatMins: 0,
      preconMins: 0,
      batThermalKwh: 0,
      balanceMins: 0,
      totalConsumedGridKwh: 0,
      activeAmp: 16,
      activePhase: 3,
      isFeasible: false,
      startDate: null,
      targetDate: null,
      lowerAmpInfo: null
    };

    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.visibility = 'hidden'; }, 400);
        }
      }, 900);
    });

    function showToast(msg) {
      const toast = document.getElementById('iosToast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove('show'); toastTimer = null; }, 2400);
    }

    function triggerHaptic(val) {
      if (val === lastHapticValue) return;
      lastHapticValue = val;
      if (val % 10 === 0 || val === 80 || val === 100 || val === 0) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(12); } catch(e){}
        }
        const hapticEl = document.getElementById('iosHapticTrigger');
        if (hapticEl) hapticEl.checked = !hapticEl.checked;
      }
    }

    function setHeroValueWithAnimation(newVal) {
      const el = document.getElementById('heroMainValue');
      if (heroTimer) { clearTimeout(heroTimer); heroTimer = null; }
      if (lastDisplayedHeroValue !== newVal) {
        el.classList.add('rolling');
        heroTimer = setTimeout(() => {
          el.innerText = newVal;
          el.classList.remove('rolling');
          lastDisplayedHeroValue = newVal;
          heroTimer = null;
        }, 110);
      } else {
        el.innerText = newVal;
        el.classList.remove('rolling');
      }
    }

    function getNowTimeString() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function syncToCurrentTime(force = false) {
      if (state.isChargingActive) return;
      if (force) state.startManual = false;
      if (state.startManual) return;
      const nowStr = getNowTimeString();
      if (!force && state.startTime === nowStr) return;
      state.startTime = nowStr;

      const el1 = document.getElementById('inputStartTime');
      const el2 = document.getElementById('inputStartTime2');
      if (el1) el1.value = state.startTime;
      if (el2) el2.value = state.startTime;
      calculate();
    }

    function handleAppResumeOrTick() {
      if (state.isChargingActive && state.activeSession) {
        const now = Date.now();
        const finishMs = state.activeSession.finishTimestamp;

        updateChargingButtonUI();
        updateUnifiedBatteryBar();
        updateCountdown();

        if (now >= finishMs) {
          const pill = document.getElementById('liveCountdownPill');
          if (pill) {
            pill.innerText = 'Şarj Tamamlandı';
            pill.className = 'countdown-pill done';
            pill.style.display = 'inline-block';
          }
        }
      } else {
        if (!state.isChargingActive) syncToCurrentTime(false);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) handleAppResumeOrTick();
    });
    window.addEventListener('pageshow', handleAppResumeOrTick);
    window.addEventListener('focus', handleAppResumeOrTick);

    function updateAmbientGlow() {
      const aura = document.getElementById('ambientAura');
      const curHour = new Date().getHours();
      const isNight = (curHour >= 22 || curHour < 6);

      if (state.isChargingActive) {
        aura.className = 'ambient-glow running';
      } else if (state.winterMode === 'on' || (state.winterMode === 'auto' && weatherAvailable && currentAmbientTemp <= 3)) {
        aura.className = 'ambient-glow heating';
      } else if (isNight) {
        aura.className = 'ambient-glow night';
      } else {
        aura.className = 'ambient-glow';
      }
    }

    function renderWeatherUI(isOfflineCached = false) {
      const iconEl = document.getElementById('weatherIconContainer');
      const sunSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
      const snowSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/></svg>`;

      if (!weatherAvailable) {
        document.getElementById('weatherText').innerText = `--°C Eskişehir`;
        iconEl.innerHTML = sunSvg;
      } else {
        document.getElementById('weatherText').innerText = `${currentAmbientTemp}°C ${state.province}${isOfflineCached ? ' (Kayıtlı)' : ''}`;
        iconEl.innerHTML = (currentAmbientTemp <= 3) ? snowSvg : sunSvg;
      }
      updateConditionsUI();
      updateAmbientGlow();
    }

    async function fetchWeatherByLocation() {
      const pData = TURKEY_GEO[state.province] || TURKEY_GEO["Eskişehir"];
      const nowMs = Date.now();
      weatherAvailable = false;
      hourlyForecastList = [];

      const cached = lsGet(CACHED_WEATHER_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          const pInfo = parsed[state.province];
          if (pInfo && pInfo.temp !== undefined) {
            currentAmbientTemp = pInfo.temp;
            hourlyForecastList = (pInfo.hourly || []).map(h => ({ timeMs: h.timeMs, temp: h.temp }));
            weatherAvailable = true;
          }
        } catch(e){}
      }
      renderWeatherUI(!navigator.onLine);

      if (!navigator.onLine) { calculate(); return; }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${pData.lat}&longitude=${pData.lon}&current=temperature_2m&hourly=temperature_2m&forecast_days=2&timezone=auto`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("API");
        const data = await res.json();

        if (data && data.current) {
          currentAmbientTemp = Math.round(data.current.temperature_2m);
          weatherAvailable = true;
          if (data.hourly && data.hourly.time && data.hourly.temperature_2m) {
            hourlyForecastList = data.hourly.time.map((tStr, idx) => ({
              timeMs: new Date(tStr).getTime(),
              temp: data.hourly.temperature_2m[idx]
            }));
          }

          let cacheObj = {};
          try { cacheObj = JSON.parse(lsGet(CACHED_WEATHER_KEY) || '{}'); } catch(e){}
          cacheObj[state.province] = {
            temp: currentAmbientTemp,
            timestamp: nowMs,
            hourly: hourlyForecastList.slice(0, 48)
          };
          lsSet(CACHED_WEATHER_KEY, JSON.stringify(cacheObj));

          renderWeatherUI(false);
          calculate();
        }
      } catch(e) {
        clearTimeout(timeoutId);
        renderWeatherUI(true);
        calculate();
      }
    }

    function resolveAutomaticBalanceTier() {
      if (state.balanceUserOverridden) return state.balanceTierIndex;
      if (!state.lastFullChargeDate) return 0;
      const daysPassed = Math.floor((Date.now() - state.lastFullChargeDate) / (1000 * 60 * 60 * 24));
      if (daysPassed <= 2) return 1;
      else if (daysPassed <= 8) return 2;
      else if (daysPassed <= 21) return 3;
      else return 0;
    }

    function getSessionEstimatedAmbient(startDate, estimatedDurationHours = 5) {
      if (!hourlyForecastList || hourlyForecastList.length === 0) return currentAmbientTemp;
      const startMs = startDate.getTime();
      const endMs = startMs + estimatedDurationHours * 3600000;
      const sessionTemps = hourlyForecastList
        .filter(item => item.timeMs >= startMs && item.timeMs <= endMs)
        .map(item => item.temp);
      if (sessionTemps.length === 0) return currentAmbientTemp;
      return Math.round(sessionTemps.reduce((a, b) => a + b, 0) / sessionTemps.length);
    }

    function getBatteryThermalHeatKwh(sessionAmbient) {
      if (state.winterMode === 'off') return 0.0;
      let amb = sessionAmbient;
      if (state.winterMode === 'auto') {
        if (!weatherAvailable || amb > 3) return 0.0;
      } else if (state.winterMode === 'on') {
        amb = Math.min(amb, 3);
      }

      let estBatTemp = amb;
      if (state.tripProfile === 'mild') estBatTemp = Math.min(8, amb + 5);
      else if (state.tripProfile === 'warm') estBatTemp = 14;
      if (estBatTemp > 3) return 0.0;

      const deltaT = 7 - estBatTemp;
      const thermalEnergyKwh = ((550 * 1.0 * deltaT) / 3600) * 1.20;
      const ambientLossKwh = Math.max(0, (3 - amb) * 0.05);
      return Math.min(4.2, Math.max(0.15, thermalEnergyKwh + ambientLossKwh));
    }

    function calculateDynamicPreconKwh(sessionAmbient) {
      if (!state.preconMode) return 0.0;
      const t = (sessionAmbient !== null) ? sessionAmbient : 15;
      const deltaT = Math.max(0, 22 - t);
      return Math.min(2.5, Math.max(0.2, 0.20 + (deltaT * 0.040)));
    }

    function resolveStartAndTargetDates(startStr, targetStr, now = new Date()) {
      const [tH, tM] = (targetStr || '07:30').split(':').map(Number);
      let startDate;
      if (state.isChargingActive && state.activeSession && state.activeSession.scheduledStartTimestamp) {
        startDate = new Date(state.activeSession.scheduledStartTimestamp);
      } else {
        const [sH, sM] = (startStr || getNowTimeString()).split(':').map(Number);
        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sH, sM, 0, 0);
        if (isNaN(startDate.getTime())) startDate = new Date(now.getTime());
        const HALF_DAY = 12 * 3600000;
        const diff = startDate.getTime() - now.getTime();
        if (diff > HALF_DAY) startDate.setDate(startDate.getDate() - 1);
        else if (diff < -HALF_DAY) startDate.setDate(startDate.getDate() + 1);
      }

      let targetDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate(), tH, tM, 0, 0);
      if (targetDate.getTime() <= startDate.getTime()) {
        targetDate.setDate(targetDate.getDate() + 1);
      }
      return { startDate, targetDate };
    }

    function formatHHMM(date) {
      if (!date || isNaN(date.getTime())) return '--:--';
      return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function calculateChargingMinutes(startSoc, endSoc, phase, amp, sessionAmbient, extraPreconKwh = 0) {
      const batThermalKwh = getBatteryThermalHeatKwh(sessionAmbient);
      if (startSoc >= endSoc && extraPreconKwh <= 0 && batThermalKwh <= 0) {
        return { totalMinutes: 0, avgKw: 0, avgEff: 0.90, totalConsumedGridKwh: 0, heatMins: 0, preconMins: 0, batThermalKwh: 0, balanceMins: 0, nominalKw: 0 };
      }

      const vEffective = Math.max(204.0, 230.0 - (amp * 0.45));
      const calib = state.calibFactor || 0.95;
      const effectiveAmp = Math.min(amp, 16);
      const effectiveRawKw = (phase * vEffective * effectiveAmp) / 1000.0;
      const phaseObcLimit = (phase === 1) ? Math.min((230.0 * 16 / 1000), T10F_OBC_KW) : T10F_OBC_KW;
      const effectiveGridKw = Math.min(effectiveRawKw * calib, phaseObcLimit);

      const baseEff = Math.min(0.92, Math.max(0.80, 0.925 - (0.24 / (effectiveGridKw + 0.6))));
      const usableNetKwh = T10F_USABLE_KWH;

      const segments = [
        { from: 0, to: 98, bmsMaxKw: 99.0 },
        { from: 98, to: 100, bmsMaxKw: 3.6 }
      ];

      let totalMinutes = 0;
      let totalNetBatteryKwh = 0;

      for (const seg of segments) {
        const sFrom = Math.max(startSoc, seg.from);
        const sTo = Math.min(endSoc, seg.to);
        if (sTo > sFrom) {
          const deltaPct = sTo - sFrom;
          const segKwh = (deltaPct / 100.0) * usableNetKwh;
          const cappedKw = Math.min(effectiveGridKw, seg.bmsMaxKw);
          const netKw = Math.max(0.3, (cappedKw * baseEff) - VEHICLE_PARASITIC_KW);
          totalMinutes += (segKwh / netKw) * 60;
          totalNetBatteryKwh += segKwh;
        }
      }

      let balanceMins = 0;
      if (endSoc >= 99) {
        const activeTier = BALANCE_MODES[state.balanceTierIndex];
        balanceMins = activeTier.mins;
        totalMinutes += balanceMins;
      }

      let heatMins = 0;
      if (batThermalKwh > 0) {
        let ptcPowerKw = Math.min(3.2, Math.max(0.6, effectiveGridKw * 0.45));
        if (ptcPowerKw >= effectiveGridKw * 0.85) ptcPowerKw = effectiveGridKw * 0.70;
        heatMins = (batThermalKwh / ptcPowerKw) * 60;
        const availableNetForBat = Math.max(0.2, ((effectiveGridKw - ptcPowerKw) * baseEff) - VEHICLE_PARASITIC_KW);
        const normalNetForBat = Math.max(0.3, (effectiveGridKw * baseEff) - VEHICLE_PARASITIC_KW);
        totalMinutes += heatMins * Math.max(0, 1.0 - (availableNetForBat / normalNetForBat));
      }

      let preconMins = (extraPreconKwh > 0) ? 15 : 0;
      totalMinutes += preconMins;

      const totalConsumedGridKwh = (totalNetBatteryKwh / baseEff) + 
                                   ((batThermalKwh + extraPreconKwh) / baseEff) + 
                                   (VEHICLE_PARASITIC_KW * (totalMinutes / 60));

      const avgEff = totalNetBatteryKwh > 0 ? (totalNetBatteryKwh / totalConsumedGridKwh) : baseEff;
      const totalHours = totalMinutes / 60;
      const avgKw = totalHours > 0 ? (totalConsumedGridKwh / totalHours) : effectiveGridKw;

      return { 
        totalMinutes, 
        avgKw, 
        avgEff, 
        totalConsumedGridKwh, 
        heatMins, 
        preconMins, 
        batThermalKwh,
        balanceMins,
        nominalKw: effectiveGridKw 
      };
    }

    const masterTube = document.getElementById('masterTouchTube');
    const floatHud = document.getElementById('tubeFloatHud');
    const specularGlare = document.getElementById('specularGlare');
    let activeDragHandle = null;

    function handleBarTouch(clientX) {
      if (state.isChargingActive) return;
      const rect = masterTube.getBoundingClientRect();
      if (!rect || rect.width <= 0) return;

      const clickX = Math.max(0, Math.min(rect.width, clientX - rect.left));
      const touchedPct = Math.max(0, Math.min(100, Math.round((clickX / rect.width) * 100)));

      if (!activeDragHandle) {
        if (touchedPct <= state.currentSoc) activeDragHandle = 'start';
        else if (touchedPct >= state.targetSoc) activeDragHandle = 'target';
        else {
          const distStart = Math.abs(touchedPct - state.currentSoc);
          const distTarget = Math.abs(touchedPct - state.targetSoc);
          activeDragHandle = (distStart <= distTarget) ? 'start' : 'target';
        }
      }

      let currentVal;
      if (activeDragHandle === 'start') {
        state.currentSoc = Math.max(0, Math.min(state.targetSoc - 1, touchedPct));
        currentVal = state.currentSoc;
      } else {
        state.targetSoc = Math.max(state.currentSoc + 1, Math.min(100, touchedPct));
        currentVal = state.targetSoc;
      }

      triggerHaptic(currentVal);
      specularGlare.classList.add('active');
      specularGlare.style.left = `${clickX}px`;
      floatHud.classList.add('active');
      floatHud.style.left = `${clickX}px`;
      floatHud.innerText = `%${currentVal}`;
      calculate();
    }

    masterTube.addEventListener('pointerdown', (e) => {
      activeDragHandle = null;
      try { masterTube.setPointerCapture(e.pointerId); } catch(err){}
      handleBarTouch(e.clientX);
    });

    masterTube.addEventListener('pointermove', (e) => {
      if (activeDragHandle) handleBarTouch(e.clientX);
    });

    const endDrag = (e) => {
      activeDragHandle = null;
      lastHapticValue = null;
      floatHud.classList.remove('active');
      specularGlare.classList.remove('active');
      try { 
        if (masterTube.hasPointerCapture(e.pointerId)) masterTube.releasePointerCapture(e.pointerId);
      } catch(err){}
    };
    masterTube.addEventListener('pointerup', endDrag);
    masterTube.addEventListener('pointercancel', endDrag);

    function updateUnifiedBatteryBar() {
      const tubeStartFill = document.getElementById('tubeStartFill');
      const tubeTargetWindow = document.getElementById('tubeTargetWindow');
      const tubeLiveFill = document.getElementById('tubeLiveFill');
      const dispCurrentSoc = document.getElementById('dispCurrentSoc');
      const dispTargetSoc = document.getElementById('dispTargetSoc');
      const txtLivePhaseMode = document.getElementById('txtLivePhaseMode');

      const startSoc = state.isChargingActive && state.activeSession ? state.activeSession.startSoc : state.currentSoc;
      const targetSoc = state.isChargingActive && state.activeSession ? state.activeSession.targetSoc : state.targetSoc;

      dispCurrentSoc.innerText = `%${startSoc}`;
      dispTargetSoc.innerText = `%${targetSoc}`;
      document.getElementById('batteryCardContainer').classList.toggle('lfp-pulse', targetSoc >= 99);

      tubeStartFill.style.width = `${startSoc}%`;
      tubeTargetWindow.style.left = `${startSoc}%`;
      tubeTargetWindow.style.width = `${Math.max(0, targetSoc - startSoc)}%`;

      if (targetSoc >= 100) tubeTargetWindow.style.borderRight = 'none';
      else tubeTargetWindow.style.borderRight = '3px solid var(--ios-cyan)';

      if (!state.isChargingActive || !state.activeSession) {
        tubeLiveFill.classList.remove('pulse');
        tubeLiveFill.style.display = 'none';
        tubeLiveFill.style.width = '0%';
        txtLivePhaseMode.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="9" r="7"/><path d="M12 6v6l4 2"/></svg><span>Beklemede</span>`;
        return;
      }

      const now = Date.now();
      const startMs = state.activeSession.scheduledStartTimestamp || state.activeSession.startTimestamp;
      const finishMs = state.activeSession.finishTimestamp;

      if (now < startMs) {
        tubeLiveFill.style.display = 'none';
        tubeLiveFill.classList.remove('pulse');
        txtLivePhaseMode.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ios-orange)" stroke-width="2.5"><circle cx="12" cy="9" r="7"/><path d="M12 6v6l4 2"/></svg><span>Başlama Bekleniyor (${state.activeSession.startTimeStr})</span>`;
        return;
      }

      const totalDurationMs = Math.max(60000, finishMs - startMs);
      const elapsedMs = Math.max(0, now - startMs);
      const progressRatio = Math.min(1.0, elapsedMs / totalDurationMs);
      const currentEstSoc = Math.min(targetSoc, Math.round(startSoc + (targetSoc - startSoc) * progressRatio));

      tubeLiveFill.style.display = 'block';
      tubeLiveFill.classList.add('pulse');
      tubeLiveFill.style.width = `${currentEstSoc}%`;

      const elapsedMins = elapsedMs / 60000;
      const heatDuration = state.activeSession.heatMins || 0;

      if (now >= finishMs) {
        txtLivePhaseMode.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ios-green)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span>Şarj Tamamlandı • %${targetSoc}</span>`;
      } else if (elapsedMins < heatDuration && heatDuration > 3) {
        txtLivePhaseMode.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ios-orange)" stroke-width="2.5"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><span>Isıtılıyor • %${currentEstSoc}</span>`;
      } else if (state.preconMode && (finishMs - now <= 16 * 60000)) {
        txtLivePhaseMode.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ios-orange)" stroke-width="2.5"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg><span>Ön İklimlendirme • %${currentEstSoc}</span>`;
      } else if (currentEstSoc >= 98 && targetSoc >= 99) {
        const curTier = BALANCE_MODES[state.balanceTierIndex];
        txtLivePhaseMode.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ios-cyan)" stroke-width="2.5"><path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM7 21h10M12 3v18M3 7h18"/></svg><span>LFP Dengeleme (${curTier.label}) • %${currentEstSoc}</span>`;
      } else {
        txtLivePhaseMode.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ios-green)" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>Şarj Oluyor • %${currentEstSoc}</span>`;
      }
    }

    function updateCountdown() {
      const pill = document.getElementById('liveCountdownPill');
      if (!state.isChargingActive || !state.activeSession) {
        pill.style.display = 'none';
        return;
      }

      const now = Date.now();
      const startMs = state.activeSession.scheduledStartTimestamp || state.activeSession.startTimestamp;
      const finishMs = state.activeSession.finishTimestamp;

      if (now < startMs) {
        const waitMins = Math.ceil((startMs - now) / 60000);
        const wH = Math.floor(waitMins / 60);
        const wM = waitMins % 60;
        pill.innerText = `${wH > 0 ? wH + ' sa ' : ''}${wM} dk sonra başlayacak`;
        pill.className = 'countdown-pill waiting';
        pill.style.display = 'inline-block';
        return;
      }

      const diffMs = finishMs - now;
      if (diffMs <= 0) {
        pill.innerText = `Şarj Tamamlandı`;
        pill.className = 'countdown-pill done';
        pill.style.display = 'inline-block';
        return;
      }

      const remTotalMins = Math.floor(diffMs / 60000);
      const remH = Math.floor(remTotalMins / 60);
      const remM = remTotalMins % 60;
      pill.innerText = `${remH > 0 ? remH + ' sa ' : ''}${remM} dk kaldı`;
      pill.className = 'countdown-pill';
      pill.style.display = 'inline-block';
    }

    function updateIntelBadge(sessionAmbient) {
      const badge = document.getElementById('badgeIntel');
      const curHour = new Date().getHours();
      const batThermalKwh = getBatteryThermalHeatKwh(sessionAmbient);

      if (batThermalKwh > 0.1) badge.innerText = `Ön Isıtma (+${batThermalKwh.toFixed(1)} kWh)`;
      else if (curHour >= 22 || curHour < 6) badge.innerText = `Gece Dolumu`;

    function updateConfirmModalValues() {

    function calculate() {
      updateConditionsUI();
      const deltaSoc = state.targetSoc - state.currentSoc;
      const netBatteryKwh = (deltaSoc / 100) * T10F_USABLE_KWH;

      const now = new Date();
      const { startDate, targetDate } = resolveStartAndTargetDates(
        state.startTime || getNowTimeString(),
        state.targetTime || '07:30',
        now
      );

      const sessionAmbient = getSessionEstimatedAmbient(startDate, Math.max(3, deltaSoc * 0.08));
      const preconEnergyKwh = calculateDynamicPreconKwh(sessionAmbient);
      const batThermalKwh = getBatteryThermalHeatKwh(sessionAmbient);

      document.getElementById('txtBatDeltaSummary').innerText = `+${deltaSoc}% • ${netBatteryKwh.toFixed(1)} kWh`;

      const badgeCv = document.getElementById('badgeCv');
      const badgeEarly = document.getElementById('badgeEarly');
      const badgePrecon = document.getElementById('badgePrecon');
      const badgeHeat = document.getElementById('badgeHeat');

      badgePrecon.style.display = state.preconMode ? 'inline-flex' : 'none';
      badgeHeat.style.display = (batThermalKwh > 0.1) ? 'inline-flex' : 'none';

      if (state.targetSoc >= 99) {
        const activeTier = BALANCE_MODES[state.balanceTierIndex];
        badgeCv.style.display = 'inline-flex';
        badgeCv.innerText = `Dengeleme (+${activeTier.mins}d)`;
      } else {
        badgeCv.style.display = 'none';
      }

      updateIntelBadge(sessionAmbient);

      if (state.tab === 'targetTime') {
        const totalMinutesRaw = Math.max(1, Math.round((targetDate.getTime() - startDate.getTime()) / 60000));
        const wH = Math.floor(totalMinutesRaw / 60);
        const wM = totalMinutesRaw % 60;
        document.getElementById('chargingWindowTag').innerText = `${wH} sa ${wM} dk süre`;

        function solveAmps(phase) {
          let bestFit = null;
          for (let a = 6; a <= 16; a++) {
            const res = calculateChargingMinutes(state.currentSoc, state.targetSoc, phase, a, sessionAmbient, preconEnergyKwh);
            if (res.totalMinutes <= totalMinutesRaw) {
              const actualFinishDate = new Date(startDate.getTime() + Math.round(res.totalMinutes) * 60000);
              const minsDiff = Math.round((targetDate.getTime() - actualFinishDate.getTime()) / 60000);
              const isFloorEarly = minsDiff > 45;

              let lowerAmpInfo = null;
              if (a > 6) {
                const lowerRes = calculateChargingMinutes(state.currentSoc, state.targetSoc, phase, a - 1, sessionAmbient, preconEnergyKwh);
                const lowerFinishDate = new Date(startDate.getTime() + Math.round(lowerRes.totalMinutes) * 60000);
                const lateMins = Math.round((lowerFinishDate.getTime() - targetDate.getTime()) / 60000);
                lowerAmpInfo = {
                  amp: a - 1,
                  nominalKw: lowerRes.nominalKw,
                  finishDate: lowerFinishDate,
                  finishTimeStr: formatHHMM(lowerFinishDate),
                  lateMins: Math.max(1, lateMins)
                };
              }

              bestFit = {
                amp: a,
                nominalKw: res.nominalKw,
                avgKw: res.avgKw,
                eff: res.avgEff,
                minsNeeded: res.totalMinutes,
                totalConsumedGridKwh: res.totalConsumedGridKwh,
                heatMins: res.heatMins,
                preconMins: res.preconMins,
                batThermalKwh: res.batThermalKwh,
                balanceMins: res.balanceMins,
                early: isFloorEarly,
                finishDate: actualFinishDate,
                finishTimeStr: formatHHMM(actualFinishDate),
                totalChargingMins: Math.round(res.totalMinutes),
                lowerAmpInfo: lowerAmpInfo
              };
              break;
            }
          }
          return bestFit ? { possible: true, ...bestFit } : { possible: false };
        }

        const tri = solveAmps(3);
        const mono = solveAmps(1);
        const triEarlyEl = document.getElementById('recTriEarly');
        const monoEarlyEl = document.getElementById('recMonoEarly');

        if (tri.possible) {
          document.getElementById('recTriAmp').innerText = `${tri.amp}A`;
          document.getElementById('recTriDetail').innerText = `${tri.nominalKw.toFixed(1)} kW (Trifaze)`;
          if (tri.early) {

    function createIcsCalendarAlarm(targetFinishDate) {
      if (!targetFinishDate || isNaN(targetFinishDate.getTime())) return;
      const toUtcIcsDate = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const start = new Date(targetFinishDate.getTime());
      const end = new Date(targetFinishDate.getTime() + 15 * 60000);

      const foldIcsLine = (line) => {
        const enc = new TextEncoder();
        let out = '', bytes = 0;
        for (const ch of line) {
          const b = enc.encode(ch).length;
          if (bytes + b > 75) { out += '\r\n '; bytes = 1; }
          out += ch; bytes += b;
        }
        return out;
      };

      const icsData = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ReadyAt//T10F Charging//TR",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        `UID:${Date.now()}@readyat.togg`,
        `DTSTAMP:${toUtcIcsDate(new Date())}`,
        `DTSTART:${toUtcIcsDate(start)}`,
        `DTEND:${toUtcIcsDate(end)}`,
        `SUMMARY:T10F Şarj Tamamlandı`,
        `DESCRIPTION:Togg T10F aracınızın AC şarjı tamamlandı. Park işgal cezası almamak için aracı çekmeyi unutmayın.`,
        "BEGIN:VALARM",
        "TRIGGER:-PT15M",
        "ACTION:DISPLAY",
        "DESCRIPTION:T10F Şarj Bitiyor!",
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ].map(foldIcsLine).join("\r\n") + "\r\n";

      try {
        const blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
        const link = document.createElement("a");
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute("download", "T10F-ReadyAt-Alarm.ics");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch(e) {
        window.open("data:text/calendar;charset=utf8," + encodeURIComponent(icsData), "_blank");
      }
    }

    function populateProvinces() {
      const pSel = document.getElementById('selectProvince');
      pSel.innerHTML = '';
      Object.keys(TURKEY_GEO).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.innerText = p;
        pSel.appendChild(opt);
      });
      if (!TURKEY_GEO[state.province]) state.province = "Eskişehir";
      pSel.value = state.province;
    }

    function applyReachedSoc(reached) {
      const cur = Math.round(Number(reached));
      if (!Number.isFinite(cur)) return;
      state.currentSoc = Math.max(0, Math.min(99, cur));
      if (state.targetSoc <= state.currentSoc) {
        state.targetSoc = Math.min(100, state.currentSoc + 20);
      }
    }

    function loadState() {
      const saved = lsGet(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === 'object') Object.assign(state, parsed);
        } catch(e){}
      }

      const savedLogs = lsGet(LOGBOOK_STORAGE_KEY);
      if (savedLogs) {
        try {
          logbook = JSON.parse(savedLogs) || [];
        } catch(e) { logbook = []; }
      }

      state.currentSoc = Math.round(clampNum(state.currentSoc, 0, 99, 20));
      state.targetSoc = Math.round(clampNum(state.targetSoc, 1, 100, 80));
      if (state.targetSoc <= state.currentSoc) state.targetSoc = Math.min(100, state.currentSoc + 1);
      state.targetPhaseChoice = (Number(state.targetPhaseChoice) === 1) ? 1 : 3;
      state.manualPhase = (Number(state.manualPhase) === 1) ? 1 : 3;
      state.manualAmp = Math.round(clampNum(state.manualAmp, 6, 16, 16));
      state.balanceTierIndex = Math.round(clampNum(state.balanceTierIndex, 0, BALANCE_MODES.length - 1, 0));
      state.calibFactor = clampNum(state.calibFactor, CALIB_MIN, CALIB_MAX, 0.95);
      state.electricityRate = (Number(state.electricityRate) > 0) ? Number(state.electricityRate) : ZES_DEFAULT_AC_PRICE;
      state.notifyActive = (state.notifyActive === true);
      if (!TURKEY_GEO[state.province]) state.province = 'Eskişehir';
      if (state.tab !== 'targetTime' && state.tab !== 'fixedAmp') state.tab = 'targetTime';
      if (!['auto', 'on', 'off'].includes(state.winterMode)) state.winterMode = 'auto';
      if (!['cold', 'mild', 'warm'].includes(state.tripProfile)) state.tripProfile = 'cold';
      if (!/^\d{2}:\d{2}$/.test(state.targetTime || '')) state.targetTime = '07:30';

      const sess = state.activeSession;
      const sessionValid = state.isChargingActive && sess &&
        Number.isFinite(sess.finishTimestamp) && Number.isFinite(sess.scheduledStartTimestamp || sess.startTimestamp);
      if (!sessionValid) {
        state.startTime = getNowTimeString();
        state.isChargingActive = false;
        state.activeSession = null;
      }
      state.startManual = false;

      populateProvinces();
      document.getElementById('selectProvince').value = state.province;
      document.getElementById('inputCalibFactor').value = state.calibFactor.toFixed(2);
      document.getElementById('inputElectricityRate').value = state.electricityRate.toFixed(2);

      document.getElementById('inputStartTime').value = state.startTime;
      document.getElementById('inputStartTime2').value = state.startTime;
      document.getElementById('inputTargetTime').value = state.targetTime;

      const isFixed = state.tab === 'fixedAmp';
      document.getElementById('tabTargetTime').classList.toggle('active', !isFixed);
      document.getElementById('tabFixedAmp').classList.toggle('active', isFixed);
      document.getElementById('panelTargetTime').style.display = isFixed ? 'none' : 'flex';
      document.getElementById('panelFixedAmp').style.display = isFixed ? 'flex' : 'none';
      document.getElementById('btnPhase3').classList.toggle('active', state.manualPhase === 3);
      document.getElementById('btnPhase1').classList.toggle('active', state.manualPhase === 1);

      document.getElementById('sliderManualAmp').value = state.manualAmp;
      document.getElementById('dispManualAmp').innerText = `${state.manualAmp}A`;

      updateConditionsUI();
      updateChargingButtonUI();
      updateUnifiedBatteryBar();
    }

    function saveState() {
      lsSet(STORAGE_KEY, JSON.stringify(state));
    }

    function applyChargingLocks() {
      const locked = !!(state.isChargingActive && state.activeSession);
      ['inputStartTime', 'inputStartTime2', 'inputTargetTime', 'sliderManualAmp', 'btnPhase1', 'btnPhase3'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = locked;
      });

    function updateChargingButtonUI() {
      const btn = document.getElementById('btnTriggerStartFlow');
      const icon = document.getElementById('btnStartIcon');
      const text = document.getElementById('btnStartText');

      if (state.isChargingActive && state.activeSession) {
        const now = Date.now();
        const startMs = state.activeSession.scheduledStartTimestamp || state.activeSession.startTimestamp;
        const finishMs = state.activeSession.finishTimestamp;

        btn.classList.remove('running', 'waiting', 'completed');

        if (now < startMs) {
          btn.classList.add('waiting');
          icon.innerHTML = `<circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2.2"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2.2"/>`;
          text.innerText = `BAŞLATMA BEKLENİYOR (${state.activeSession.startTimeStr})`;
        } else if (now >= finishMs) {
          btn.classList.add('completed');
          icon.innerHTML = `<polyline points="20 6 9 17 4 12" stroke="currentColor" fill="none" stroke-width="2.8"/>`;
          text.innerText = `ŞARJ TAMAMLANDI • SEANSI DOĞRULA`;
        } else {
          btn.classList.add('running');
          icon.innerHTML = `<circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2.2"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2.2"/>`;
          text.innerText = `ŞARJ AKTİF • ${state.activeSession.predictedFinish || '--:--'}`;
        }
      } else {
        btn.classList.remove('running', 'waiting', 'completed');
        icon.innerHTML = `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="none" stroke="currentColor" stroke-width="2.6"/>`;
        text.innerText = 'ŞARJI BAŞLAT';
      }
      applyChargingLocks();
      updateAmbientGlow();
    }

        scheduledStartTimestamp: schedStart.getTime(),
        finishTimestamp: finishDate.getTime(),
        predictedFinish: lastCalculatedPrediction.predictedFinishStr,
        totalMins: Math.max(1, lastCalculatedPrediction.totalChargingMins),
        heatMins: lastCalculatedPrediction.heatMins,
        preconMins: lastCalculatedPrediction.preconMins,
        balanceMins: lastCalculatedPrediction.balanceMins,
        activeAmp: lastCalculatedPrediction.activeAmp,
        activePhase: lastCalculatedPrediction.activePhase,
        totalConsumedGridKwh: lastCalculatedPrediction.totalConsumedGridKwh
      };
