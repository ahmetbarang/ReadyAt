    document.getElementById('btnLogSubmitPrompt').addEventListener('click', () => {
      const val = parseFloat(document.getElementById('logPromptInput').value);
      if (isNaN(val)) {
        showToast("Lütfen geçerli bir sayı girin.");
        return;
      }

      const refStart = state.activeSession ? state.activeSession.startSoc : state.currentSoc;
      const refTarget = state.activeSession ? state.activeSession.targetSoc : state.targetSoc;
      const kwh = state.activeSession ? state.activeSession.totalConsumedGridKwh : lastCalculatedPrediction.totalConsumedGridKwh;
      const amp = state.activeSession ? state.activeSession.activeAmp : lastCalculatedPrediction.activeAmp;
      const phase = state.activeSession ? state.activeSession.activePhase : lastCalculatedPrediction.activePhase;

      if (currentLogMode === 'early') {
        if (val <= 0) {
          showToast("0'dan büyük dakika girin.");
          return;
        }
        const totalSessionMins = Math.max(30, state.activeSession?.totalMins || 240);
        const shiftFactor = Math.min(0.12, (val / totalSessionMins) * 0.20);
        state.calibFactor = clampCalib((state.calibFactor || 0.95) * (1 + shiftFactor));
        document.getElementById('inputCalibFactor').value = state.calibFactor.toFixed(2);
        
        applyReachedSoc(refTarget);
        if (refTarget >= 99) {
          state.lastFullChargeDate = Date.now();
          state.balanceUserOverridden = false;
        }

        addSessionToLogbook({
          dateStr: new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' }),
          startTime: state.activeSession ? state.activeSession.startTimeStr : getNowTimeString(),
          finishTime: formatHHMM(new Date()),
          startSoc: refStart,
          targetSoc: refTarget,
          kwh: kwh,
          amp: amp,
          phase: phase,
          note: `${val} dk erken (x${state.calibFactor.toFixed(2)})`
        });
        showToast("Erken bitiş hafızaya alındı, katsayı güncellendi.");
      } else if (currentLogMode === 'missing') {
        if (val >= refTarget || val < refStart) {
          showToast(`Değer %${refStart} ile %${refTarget} arasında olmalıdır.`);
          return;
        }
        const actualDelta = val - refStart;
        const targetDelta = refTarget - refStart;
        const ratio = actualDelta / targetDelta;
        const dampingAdjustment = Math.max(-0.15, Math.min(0.15, (ratio - 1) * 0.15));
        state.calibFactor = clampCalib((state.calibFactor || 0.95) * (1 + dampingAdjustment));
        document.getElementById('inputCalibFactor').value = state.calibFactor.toFixed(2);
        applyReachedSoc(val);

        addSessionToLogbook({
          dateStr: new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' }),
          startTime: state.activeSession ? state.activeSession.startTimeStr : getNowTimeString(),
          finishTime: formatHHMM(new Date()),
          startSoc: refStart,
          targetSoc: val,
          kwh: kwh,
          amp: amp,
          phase: phase,
          note: `Eksik (%${val}) (x${state.calibFactor.toFixed(2)})`
        });
        showToast("Eksik dolum hafızaya alındı, katsayı güncellendi.");
      }

      state.isChargingActive = false;
      state.activeSession = null;
      updateChargingButtonUI();
      updateUnifiedBatteryBar();
      updateCountdown();
      document.getElementById('modalLog').classList.remove('open');
      saveState();
      calculate();
    });

    const tabTargetTime = document.getElementById('tabTargetTime');
    const tabFixedAmp = document.getElementById('tabFixedAmp');
    const panelTargetTime = document.getElementById('panelTargetTime');
    const panelFixedAmp = document.getElementById('panelFixedAmp');

    tabTargetTime.addEventListener('click', () => {
      state.tab = 'targetTime';
      tabTargetTime.classList.add('active');
      tabFixedAmp.classList.remove('active');
      panelTargetTime.style.display = 'flex';
      panelFixedAmp.style.display = 'none';
      calculate();
    });

    tabFixedAmp.addEventListener('click', () => {
      state.tab = 'fixedAmp';
      tabFixedAmp.classList.add('active');
      tabTargetTime.classList.remove('active');
      panelFixedAmp.style.display = 'flex';
      panelTargetTime.style.display = 'none';
      calculate();
    });

    document.getElementById('recTriCard').addEventListener('click', () => {
      if (state.isChargingActive) return;
      state.targetPhaseChoice = 3;
      calculate();
    });

    document.getElementById('recMonoCard').addEventListener('click', () => {
      if (state.isChargingActive) return;
      state.targetPhaseChoice = 1;
      calculate();
    });

    document.querySelectorAll('.ios-chip-btn').forEach(chip => {
      chip.addEventListener('click', () => {
        state.tripProfile = chip.getAttribute('data-trip');
        calculate();
      });
    });

    function onStartTimeInput(e) {
      if (state.isChargingActive) return;
      if (!e.target.value) { syncToCurrentTime(true); return; }
      state.startManual = true;
      state.startTime = e.target.value;
      document.getElementById('inputStartTime').value = e.target.value;
      document.getElementById('inputStartTime2').value = e.target.value;
      calculate();
    }
    document.getElementById('inputStartTime').addEventListener('input', onStartTimeInput);
    document.getElementById('inputStartTime2').addEventListener('input', onStartTimeInput);

    document.getElementById('btnSetNow').addEventListener('click', () => syncToCurrentTime(true));
    document.getElementById('btnSetNow2').addEventListener('click', () => syncToCurrentTime(true));
    
    document.getElementById('inputTargetTime').addEventListener('input', (e) => {
      state.targetTime = e.target.value;
      calculate();
    });

    document.getElementById('btnPhase3').addEventListener('click', () => {
      state.manualPhase = 3;
      document.getElementById('btnPhase3').classList.add('active');
      document.getElementById('btnPhase1').classList.remove('active');
      calculate();
    });

    document.getElementById('btnPhase1').addEventListener('click', () => {
      state.manualPhase = 1;
      document.getElementById('btnPhase1').classList.add('active');
      document.getElementById('btnPhase3').classList.remove('active');
      calculate();
    });

    document.getElementById('sliderManualAmp').addEventListener('input', (e) => {
      state.manualAmp = parseInt(e.target.value, 10);
      document.getElementById('dispManualAmp').innerText = `${state.manualAmp}A`;
      calculate();
    });

    const modalSettings = document.getElementById('modalSettings');
    const infoCardBox = document.getElementById('infoCardBox');
    
    document.getElementById('btnSettings').addEventListener('click', () => modalSettings.classList.add('open'));
    document.getElementById('btnHeaderCrest').addEventListener('click', () => modalSettings.classList.add('open'));
    document.getElementById('btnCloseSettings').addEventListener('click', () => modalSettings.classList.remove('open'));

    document.getElementById('btnToggleInfo').addEventListener('click', () => {
      infoCardBox.classList.toggle('open');
    });

    document.getElementById('btnSaveSettings').addEventListener('click', () => {
      const calib = parseFloat(document.getElementById('inputCalibFactor').value);
      const rate = parseFloat(document.getElementById('inputElectricityRate').value);

      if (!Number.isFinite(calib) || calib < CALIB_MIN || calib > CALIB_MAX) {
        showToast("Düzeltme çarpanı 0,75 – 1,25 arasında olmalıdır.");
        return;
      }
      if (!Number.isFinite(rate) || rate <= 0 || rate > 1000) {
        showToast("Birim fiyat geçerli bir sayı olmalıdır.");
        return;
      }

      const oldProv = state.province;
      const selProv = document.getElementById('selectProvince').value;
      state.province = TURKEY_GEO[selProv] ? selProv : 'Eskişehir';
      state.calibFactor = calib;
      state.electricityRate = rate;

      modalSettings.classList.remove('open');
      showToast("T10F ayarları kaydedildi.");

      if (oldProv !== state.province) fetchWeatherByLocation();
      else calculate();
    });

    window.addEventListener('online', () => {
      showToast("Çevrim içi: Eskişehir hava durumu alınıyor.");
      fetchWeatherByLocation();
    });
    window.addEventListener('offline', () => {
      showToast("Çevrim dışı: Kayıtlı veriler kullanılıyor.");
      renderWeatherUI(true);
    });

    setInterval(() => {
      handleAppResumeOrTick();
    }, 5000);

    loadState();
    fetchWeatherByLocation();
  <@/script>
</body>
</html></script>

    (function generateAppAssets() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createRadialGradient(256, 256, 50, 256, 256, 320);
      bgGrad.addColorStop(0, '#151c28');
      bgGrad.addColorStop(0.6, '#080a0f');
      bgGrad.addColorStop(1, '#020305');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 512);

      const arcGrad = ctx.createLinearGradient(120, 80, 420, 440);
      arcGrad.addColorStop(0, '#ff9f0a');
      arcGrad.addColorStop(0.5, '#ff453a');
      arcGrad.addColorStop(1, '#ffb340');

      ctx.lineWidth = 28;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath();
      ctx.arc(256, 256, 160, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = arcGrad;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#ff9f0a';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.arc(256, 256, 160, -Math.PI / 2, Math.PI * 0.82);
      ctx.stroke();

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(256, 92);
      ctx.lineTo(256, 126);
      ctx.stroke();

      ctx.fillStyle = arcGrad;
      ctx.shadowColor = '#ff9f0a';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.moveTo(274, 165);
      ctx.lineTo(210, 270);
      ctx.lineTo(262, 270);
      ctx.lineTo(238, 355);
      ctx.lineTo(312, 246);
      ctx.lineTo(262, 246);
      ctx.closePath();
      ctx.fill();

      const pngUri = canvas.toDataURL('image/png');
      document.getElementById('dynamicAppleIcon').href = pngUri;
      document.getElementById('dynamicFavicon').href = pngUri;
    })();

    .btn-ios-primary.running { background: linear-gradient(180deg, #34d662 0%, #24b04a 100%); color: #000000; box-shadow: 0 8px 24px rgba(48, 209, 88, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
    .btn-ios-primary:active { transform: scale(0.975); }

    /* KOŞULLAR BARI */
    .conditions-trigger-bar { background: var(--bg-card); border: 0.5px solid var(--card-border); border-radius: 14px; padding: 10px 13px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; box-shadow: var(--card-shadow), var(--card-highlight); flex-shrink: 0; }
    .conditions-trigger-bar:active { background: var(--bg-card-secondary); transform: scale(0.985); }
    .conditions-left { display: flex; align-items: center; gap: 8px; }
    .conditions-icon { color: var(--ios-cyan); display: flex; align-items: center; }
    .conditions-title { font-size: 12.5px; font-weight: 700; color: #fff; }
    .conditions-summary { font-size: 11px; color: var(--text-secondary); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

    /* EN ÜSTTEKİ İSTASYON BLOĞU (KOŞULLAR BARI İLE AYNI) */
    .nearest-station-card { background: var(--bg-card); border: 0.5px solid var(--card-border); border-radius: 14px; padding: 10px 13px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; box-shadow: var(--card-shadow), var(--card-highlight); }
    .nearest-station-card.active-bind { border-color: rgba(255, 159, 10, 0.5); background: rgba(255, 159, 10, 0.1); }
    .nearest-station-card:active { background: var(--bg-card-secondary); transform: scale(0.985); }
    .nearest-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .gps-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ios-green); flex-shrink: 0; box-shadow: 0 0 8px rgba(48, 209, 88, 0.7); }
    .nearest-text-wrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; overflow: hidden; }
    .nearest-name { font-size: 12.5px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nearest-meta { font-size: 11px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nearest-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .nearest-kw-tag { font-size: 12.5px; font-weight: 900; color: var(--ios-orange); font-variant-numeric: tabular-nums; background: rgba(255, 159, 10, 0.14); padding: 2.5px 7.5px; border-radius: 7px; border: 0.5px solid rgba(255, 159, 10, 0.35); display: flex; align-items: center; gap: 4px; }
    .lock-mini-icon { display: none; width: 10px; height: 10px; color: var(--ios-orange); }
    .nearest-station-card.active-bind .lock-mini-icon { display: inline-block; }
    .btn-dots-trigger { background: var(--bg-card-secondary); border: 0.5px solid var(--card-border); color: var(--text-secondary); border-radius: 8px; width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; font-weight: 800; transition: transform 0.1s; }

    /* GÜÇ BUTONLARI (AC REC-CELL STİLİ) */
    .station-select-section { display: flex; flex-direction: column; gap: 6px; }
    .grid-kw-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .kw-btn { background: var(--bg-card-secondary); border: 1.5px solid transparent; border-radius: 13px; padding: 8px 10px 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; position: relative; transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease; box-shadow: var(--card-highlight); }
    .kw-btn.selected { border-color: var(--ios-orange); background: rgba(255, 159, 10, 0.20); box-shadow: 0 0 20px rgba(255, 159, 10, 0.35), var(--card-highlight); }
    .kw-btn-val { font-size: 14.5px; font-weight: 900; color: #ffffff; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
    .kw-btn.selected .kw-btn-val { color: var(--ios-orange); }
    .kw-auto-badge { display: none; position: absolute; top: -5px; right: -3px; font-size: 8.5px; font-weight: 800; background: var(--ios-orange); color: #000; padding: 1px 4px; border-radius: 5px; }
    .kw-btn.locked-by-gps.selected .kw-auto-badge { display: block; }
    .kw-btn.locked-by-gps:not(.selected) { opacity: 0.45; cursor: not-allowed; }

    /* ÖZEL GÜÇ SEÇİM BARI */
    .custom-power-bar { background: var(--bg-card-secondary); border: 1.5px solid transparent; border-radius: 13px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: var(--card-highlight); transition: all 0.2s ease; }
    .custom-power-bar.selected { border-color: var(--ios-orange); background: rgba(255, 159, 10, 0.20); box-shadow: 0 0 20px rgba(255, 159, 10, 0.35), var(--card-highlight); }
    .custom-power-bar.locked-by-gps { opacity: 0.45; cursor: not-allowed; }
    .custom-left-label { font-size: 12.5px; font-weight: 700; color: #fff; }
    .custom-val-badge { font-size: 13.5px; font-weight: 900; color: var(--ios-orange); display: flex; align-items: center; gap: 4px; }
    .custom-input-wrap { display: none; align-items: center; gap: 6px; }
    .custom-input-wrap.open { display: flex; }
    .custom-kw-field { width: 58px; background: var(--bg-card-secondary); border: 0.5px solid var(--card-border); border-radius: 13px; color: #fff; font-size: 14px; font-weight: 800; padding: 6px 10px; text-align: center; outline: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1); }

    /* İSTATİSTİKLER */
    .stats-quad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-radius: 16px; padding: 10px 6px; text-align: center; flex-shrink: 0; }
    .stat-k { font-size: 9.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-v { font-size: 14.5px; font-weight: 800; color: var(--text-primary); font-variant-numeric: tabular-nums; margin-top: 2px; }

    .footer-text { text-align: center; padding: 4px 12px 0px; font-size: 10.5px; line-height: 1.4; color: var(--text-tertiary); font-weight: 500; flex-shrink: 0; }

    @keyframes appleShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
    .shake { animation: appleShake 0.32s ease-in-out; }

    /* SÜRÜŞ CHIP SEÇİMLERİ (AC MİMARİSİ) */
    .ios-chips-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 6px; }
    .ios-chip-btn { background: var(--bg-card-secondary); border: 1.5px solid transparent; border-radius: 13px; padding: 11px 5px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: all 0.2s ease; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
    .ios-chip-btn svg { opacity: 0.65; }
    .ios-chip-btn.active { background: var(--bg-card-tertiary); border-color: rgba(255, 159, 10, 0.4); color: #ffffff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
    .ios-chip-btn.active svg { opacity: 1; color: var(--ios-orange); }

    /* MODAL (AC MİMARİSİ) */
    .ios-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); z-index: 100; align-items: flex-end; justify-content: center; }
    .ios-modal-backdrop.open { display: flex; }
    .ios-modal-card { width: 100%; max-width: 420px; max-height: 88dvh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; background: rgba(16, 20, 30, 0.94); border: 0.5px solid rgba(255, 255, 255, 0.18); box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
    .modal-nav { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 18px; font-weight: 800; color: #fff; }
    .modal-toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card-secondary); border: 0.5px solid var(--card-border); border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); transition: background 0.15s ease; }
    .modal-toggle-row:active { background: var(--bg-card-tertiary); }
    .modal-toggle-row .info-col { display: flex; flex-direction: column; gap: 2px; }
    .modal-toggle-row .row-title { font-size: 14px; font-weight: 700; color: #fff; }
    .modal-toggle-row .row-sub { font-size: 11.5px; color: var(--text-secondary); }
    .toggle-badge-val { font-size: 12.5px; font-weight: 700; color: var(--ios-cyan); background: rgba(10, 132, 255, 0.18); border: 1px solid rgba(10, 132, 255, 0.35); padding: 4px 10px; border-radius: 9px; }

    .alt-list { display: flex; flex-direction: column; gap: 7px; }
    .alt-item { background: var(--bg-card-secondary); border: 0.5px solid var(--card-border); border-radius: 14px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s ease; }
    .alt-item:active { background: var(--bg-card-tertiary); }
    .alt-item-info { display: flex; flex-direction: column; gap: 2px; max-width: 75%; }
    .alt-item-name { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alt-item-sub { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alt-item-kw { font-size: 14.5px; font-weight: 800; color: var(--ios-orange); }

    /* LOGBOOK LİSTESİ */
    .logbook-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; margin-top: 4px; }

    .ios-toast { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(28, 34, 48, 0.96); border: 0.5px solid var(--card-border); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); color: #ffffff; padding: 11px 20px; border-radius: 22px; font-size: 13.5px; font-weight: 700; box-shadow: 0 12px 32px rgba(0,0,0,0.6); z-index: 10000; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .ios-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 380px) {
      .header-center-crest { display: none; }
      .nav-header { grid-template-columns: minmax(0, 1fr) auto; }
      .weather-capsule { max-width: 120px; }
      .header-dc-subbadge { display: none; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientAura"></div>
  <div class="ios-toast" id="iosToast">İşlem Başarılı</div>

  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo-box">
      <svg viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <linearGradient id="splashDcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff9f0a" />
            <stop offset="100%" stop-color="#ffb340" />

        </defs>
        <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="26" />
        <path class="splash-arc-fill" d="M 256,96 A 160,160 0 1,1 117,336" fill="none" stroke="url(#splashDcGrad)" stroke-width="26" stroke-linecap="round" />
        <line x1="256" y1="96" x2="256" y2="128" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
        <path class="splash-bolt-glow" d="M 274,165 L 210,270 L 262,270 L 238,355 L 312,246 L 262,246 Z" fill="url(#splashDcGrad)" />

    </div>
  </div>

  <div class="app-viewport">
    
    <header class="nav-header">
      <div class="brand-stack">
        <div class="app-icon-badge">
          <svg viewBox="0 0 512 512" width="24" height="24">
            <defs>
              <linearGradient id="navBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff9f0a" />
                <stop offset="100%" stop-color="#ffb340" />
              </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="28" />
            <path d="M 256,96 A 160,160 0 1,1 117,336" fill="none" stroke="url(#navBrandGrad)" stroke-width="28" stroke-linecap="round" />
            <line x1="256" y1="96" x2="256" y2="126" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
            <path d="M 274,165 L 210,270 L 262,270 L 238,355 L 312,246 L 262,246 Z" fill="url(#navBrandGrad)" />

      <div class="header-center-crest" title="Togg T10F">

          <svg width="48" height="27" viewBox="0 0 160 90" fill="currentColor">
            <polygon points="80,0 0,45 80,90 40,45" />
            <polygon points="80,0 160,45 80,90 120,45" />
          </svg>
        </div>
        <span class="crest-tag-abg">ABG</span>

          </span>

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="segmented-control">
      <button class="segment-btn active" id="tabDurationToSoc">Süre &rarr; Şarj Oranı</button>
      <button class="segment-btn" id="tabSocToDuration">Hedef Şarj &rarr; Süre</button>

    <@!-- ÇİFT DOKUNMATİK TÜP KARTI + ŞARJI BAŞLAT BUTONU -->
    <div class="interactive-bars-card ios-glass-card">

  <script>
    const T10F_USABLE_KWH = 85.8;
    const T10F_WLTP_KM = 600;

    const DC_CURVE_TIERS = [
      { from: 0, to: 35, baseKw: 155 },
      { from: 35, to: 55, baseKw: 140 },
      { from: 55, to: 70, baseKw: 105 },
      { from: 70, to: 80, baseKw: 75 },
      { from: 80, to: 90, baseKw: 42 },
      { from: 90, to: 97, baseKw: 24 },
      { from: 97, to: 100, baseKw: 9 }
    ];

    const REAL_DC_STATIONS = [
      { id: 'shell-yildiztepe', name: "Shell Recharge • Yıldıztepe", city: "Eskişehir", lat: 39.7562, lon: 30.5185, kw: 120 },
      { id: 'trugo-capella', name: "Trugo • Cassaba / Capella Park", city: "Eskişehir", lat: 39.7825, lon: 30.5055, kw: 180 },
      { id: 'zes-shell-cevre', name: "ZES • Shell İstasyonu DC", city: "Eskişehir", lat: 39.7872, lon: 30.5190, kw: 120 },
      { id: 'zes-espark', name: "ZES • Espark AVM", city: "Eskişehir", lat: 39.7802, lon: 30.5118, kw: 120 },
      { id: 'trugo-batikent', name: "Trugo • Batıkent Shell", city: "Eskişehir", lat: 39.7924, lon: 30.4851, kw: 180 },
      { id: 'esarj-opet-bursa', name: "Eşarj • Opet Bursa Yolu", city: "Eskişehir", lat: 39.7680, lon: 30.4502, kw: 120 },
      { id: 'trugo-sivrihisar', name: "Trugo HPC • Sivrihisar", city: "Eskişehir", lat: 39.4490, lon: 31.5350, kw: 300 }
    ];

    const BALANCE_OPTIONS = [
      { label: "< 1 Hafta (5 dk)", val: 5 },
      { label: "1-2 Hafta (15 dk)", val: 15 },
      { label: "2-4 Hafta (25 dk)", val: 25 },
      { label: "> 1 Ay (40 dk)", val: 40 }
    ];

    let state = {
      tab: 'durationToSoc',
      currentSoc: 20,
      targetSoc: 80,
      durationMins: 25,
      stationKw: 120,
      isAutoStationBound: true,
      currentStation: null,
      userCoords: { lat: 39.7580, lon: 30.5170 }, 
      cityName: "Eskişehir",
      
      ambientTemp: 15,
      weatherFetched: false,
      tripProfile: 'warm', 
      secondCarActive: false,
      cabinAcActive: false,
      alarmActive: false,
      balanceTierIdx: 2, 

      mlFactor: 1.0, 
      logbook: [],

      isChargingRunning: false,
      startTimestamp: 0,
      finishTimestamp: 0,
      startLiveSoc: 20,
      targetLiveSoc: 80,
      activeSessionPredictedMins: 0,
      activeSessionPredictedSoc: 0
    };

    let activeDragHandle = null;
    let isDurationDragging = false;
    let toastTimer = null;
    let chargingInterval = null;

    function loadState() {
      try {
        const storedLog = localStorage.getItem('readyat_dc_logbook');
        if (storedLog) state.logbook = JSON.parse(storedLog);
        const storedML = localStorage.getItem('readyat_dc_mlfactor');
        if (storedML) state.mlFactor = parseFloat(storedML);
      } catch(e){}
    }

    function saveState() {
      localStorage.setItem('readyat_dc_logbook', JSON.stringify(state.logbook));
      localStorage.setItem('readyat_dc_mlfactor', state.mlFactor.toString());
    }

    function showToast(msg) {
      const toast = document.getElementById('iosToast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove('show'); toastTimer = null; }, 2200);
    }

    function calcDist(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    async function fetchWeather(lat, lon) {
      const iconEl = document.getElementById('weatherIconContainer');
      const textEl = document.getElementById('weatherText');
      const sunSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
      const snowSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/></svg>`;

      let locName = state.cityName || "Eskişehir";

      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`);
        if(res.ok) {
          const data = await res.json();
          if(data && data.current) {
            state.ambientTemp = Math.round(data.current.temperature_2m);
            state.weatherFetched = true;
          }
        }
        
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
        if(geoRes.ok) {
          const geoData = await geoRes.json();
          if(geoData && geoData.address) {
            locName = geoData.address.city || geoData.address.province || geoData.address.town || "Eskişehir";
            state.cityName = locName;
          }
        }

        textEl.innerText = `${state.ambientTemp}°C ${locName}`;
        iconEl.innerHTML = (state.ambientTemp < 10) ? snowSvg : sunSvg;
        updateConditionsSummary();
        calculate();
        
      } catch(e) {
        textEl.innerText = `${state.ambientTemp}°C ${state.cityName || "Eskişehir"}`;
        iconEl.innerHTML = sunSvg;
      }
    }

    function createIcsCalendarAlarm(targetFinishDate) {
      if (!targetFinishDate || isNaN(targetFinishDate.getTime())) return;
      const toUtcIcsDate = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const start = new Date(targetFinishDate.getTime());
      const end = new Date(targetFinishDate.getTime() + 15 * 60000); 

      const foldIcsLine = (line) => {
        const enc = new TextEncoder();
        let out = '', bytes = 0;
        for (const ch of line) {
          const b = enc.encode(ch).length;
          if (bytes + b > 75) { out += '\r\n '; bytes = 1; }
          out += ch; bytes += b;
        }
        return out;
      };

      const icsData = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ReadyAt//T10F Charging//TR",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        `UID:${Date.now()}@readyat.togg`,
        `DTSTAMP:${toUtcIcsDate(new Date())}`,
        `DTSTART:${toUtcIcsDate(start)}`,
        `DTEND:${toUtcIcsDate(end)}`,
        `SUMMARY:T10F DC Şarj Tamamlandı`,
        `DESCRIPTION:Togg T10F aracınızın DC hızlı şarjı tamamlandı. Park işgal cezası almamak için aracı istasyondan çekmeyi unutmayın.`,
        "BEGIN:VALARM",
        "TRIGGER:PT0S",
        "ACTION:DISPLAY",
        "DESCRIPTION:DC Şarj Süresi Doldu!",
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ].map(foldIcsLine).join("\r\n") + "\r\n";

      try {
        const blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
        const link = document.createElement("a");
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute("download", "T10F-DC-Alarm.ics");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch(e) {
        window.open("data:text/calendar;charset=utf8," + encodeURIComponent(icsData), "_blank");
      }
    }

    function getEffectiveAmps(kw) {
      if (kw <= 60) return 150;
      if (kw <= 120) return 300;
      return 500; 
    }

    function getSimulatedPowerMetrics(s, passedMins) {
      let stKw = state.secondCarActive ? state.stationKw / 2 : state.stationKw;
      let baseAmps = getEffectiveAmps(state.stationKw);
      let stAmps = state.secondCarActive ? baseAmps / 2 : baseAmps;

      const voltage = 340 + (s * 0.6); 
      const cableLimitKw = (voltage * stAmps) / 1000;

      const tier = DC_CURVE_TIERS.find(t => s >= t.from && s < t.to) || DC_CURVE_TIERS[DC_CURVE_TIERS.length - 1];
      
      let grossKw = Math.min(stKw, cableLimitKw, tier.baseKw);

      let applyColdgate = (state.weatherFetched && state.ambientTemp < 10 && state.tripProfile !== 'warm');
      let ptcKw = (applyColdgate && passedMins < 12) ? 6 : 0;
      let acKw = state.cabinAcActive ? 3.5 : 0;

      let batIntakeLimit = 999;
      if (applyColdgate) {
        if (state.tripProfile === 'cold' && passedMins < 12) batIntakeLimit = 45;
        else if (state.tripProfile === 'mild' && passedMins < 6) batIntakeLimit = 75;
      }

      let netKw = Math.max(1, grossKw - ptcKw - acKw);
      netKw = Math.min(netKw, batIntakeLimit);

      if (s >= 98) {
         let balanceMins = BALANCE_OPTIONS[state.balanceTierIdx].val;
         let minsPerPct = balanceMins / 2;
         if (minsPerPct <= 0) minsPerPct = 0.5;
         netKw = ((T10F_USABLE_KWH * 0.01) / (minsPerPct / 60));
      }

      let actualGridKw = netKw + ptcKw + acKw;
      return { netKw, actualGridKw };
    }

    function simulateDcCharge(startSoc, targetSoc) {
      let totalMinutes = 0;
      let totalKwh = 0;
      let s = startSoc;
      let eff = Math.max(0.70, Math.min(0.99, 0.94 * state.mlFactor));

      while (s < targetSoc) {
        const nextStep = Math.min(targetSoc, s + 1);
        const { netKw, actualGridKw } = getSimulatedPowerMetrics(s, totalMinutes);
        
        const stepKwh = (1 / 100) * T10F_USABLE_KWH;
        const stepHours = stepKwh / (netKw * eff);
        
        totalMinutes += stepHours * 60;
        totalKwh += actualGridKw * stepHours;
        s = nextStep;
      }

      return {
        totalMinutes: Math.max(1, Math.round(totalMinutes)),
        totalKwh: totalKwh,
        avgKw: totalMinutes > 0 ? (totalKwh / (totalMinutes / 60)) : 0
      };
    }

    function simulateDcByMinutes(startSoc, availableMins) {
      let passedMins = 0;
      let currentS = startSoc;
      let totalKwh = 0;
      let eff = Math.max(0.70, Math.min(0.99, 0.94 * state.mlFactor));

      while (passedMins < availableMins && currentS < 100) {
        const { netKw, actualGridKw } = getSimulatedPowerMetrics(currentS, passedMins);
        
        const stepKwh = (1 / 100) * T10F_USABLE_KWH;
        const stepMinutes = (stepKwh / (netKw * eff)) * 60;

        if (passedMins + stepMinutes <= availableMins) {
          passedMins += stepMinutes;
          totalKwh += actualGridKw * (stepMinutes / 60);
          currentS += 1;
        } else {
          const remMins = availableMins - passedMins;
          totalKwh += actualGridKw * (remMins / 60);
          currentS += ((netKw * eff) * (remMins / 60)) / T10F_USABLE_KWH * 100;
          break;
        }
      }

      return {
        reachedSoc: Math.min(100, Math.round(currentS)),
        totalKwh: totalKwh,
        avgKw: availableMins > 0 ? (totalKwh / (availableMins / 60)) : 0
      };
    }

    function calculate() {
      if (state.isChargingRunning) return;

      const balanceRow = document.getElementById('rowToggleBalance');
      if (state.targetSoc >= 98 || state.currentSoc >= 98) {
        balanceRow.style.display = 'flex';
      } else {
        balanceRow.style.display = 'none';
      }

      if (state.tab === 'durationToSoc') {
        const res = simulateDcByMinutes(state.currentSoc, state.durationMins);
        state.targetSoc = res.reachedSoc;
        const kmGained = Math.round((res.totalKwh / T10F_USABLE_KWH) * T10F_WLTP_KM);

        document.getElementById('statKwh').innerText = `${res.totalKwh.toFixed(1)} kWh`;
        document.getElementById('statAvgKw').innerText = `${Math.round(res.avgKw)} kW`;
        document.getElementById('statKm').innerText = `+${kmGained} km`;

        updateDurationTubeVisual(state.durationMins);
        state.activeSessionPredictedMins = state.durationMins;
        state.activeSessionPredictedSoc = res.reachedSoc;
      } else {
        const res = simulateDcCharge(state.currentSoc, state.targetSoc);
        state.durationMins = Math.min(60, res.totalMinutes);
        const kmGained = Math.round((res.totalKwh / T10F_USABLE_KWH) * T10F_WLTP_KM);

        document.getElementById('statKwh').innerText = `${res.totalKwh.toFixed(1)} kWh`;
        document.getElementById('statAvgKw').innerText = `${Math.round(res.avgKw)} kW`;
        document.getElementById('statKm').innerText = `+${kmGained} km`;

        updateDurationTubeVisual(state.durationMins);
        state.activeSessionPredictedMins = res.totalMinutes;
        state.activeSessionPredictedSoc = state.targetSoc;
      }

      updateBatteryBarVisual();
    }

    function tickRealtimeCharging() {
      const now = Date.now();
      const diffMs = state.finishTimestamp - now;

      if (diffMs <= 0) {
        finishChargeWithLogbook();
        return;
      }

      const totalMs = state.finishTimestamp - state.startTimestamp;
      const progressRatio = Math.min(1, Math.max(0, (now - state.startTimestamp) / totalMs));
      const remTotalSec = Math.ceil(diffMs / 1000);
      const remMins = Math.floor(remTotalSec / 60);
      const remSecs = remTotalSec % 60;

      document.getElementById('durationFill').style.width = `${((1 - progressRatio) * (state.durationMins / 60)) * 100}%`;
      document.getElementById('dispDurationBadge').innerText = `${remMins} dk ${remSecs} sn kaldı`;

      const liveSoc = Math.min(state.targetLiveSoc, Math.round(state.startLiveSoc + (state.targetLiveSoc - state.startLiveSoc) * progressRatio));
      const liveStream = document.getElementById('tubeLiveStream');
      liveStream.style.left = `${state.startLiveSoc}%`;
      liveStream.style.width = `${Math.max(0, liveSoc - state.startLiveSoc)}%`;
      document.getElementById('dispCurrentSoc').innerText = `%${liveSoc}`;
    }

    function startChargingSession() {
      state.isChargingRunning = true;
      state.startTimestamp = Date.now();
      
      if (state.tab === 'durationToSoc') {
        const res = simulateDcByMinutes(state.currentSoc, state.durationMins);
        state.activeSessionPredictedSoc = res.reachedSoc;
        state.activeSessionPredictedMins = state.durationMins;
        state.finishTimestamp = Date.now() + (state.durationMins * 60 * 1000);
        state.targetLiveSoc = res.reachedSoc;
      } else {
        const res = simulateDcCharge(state.currentSoc, state.targetSoc);
        state.activeSessionPredictedMins = res.totalMinutes;
        state.activeSessionPredictedSoc = state.targetSoc;
        state.finishTimestamp = Date.now() + (res.totalMinutes * 60 * 1000);
        state.targetLiveSoc = state.targetSoc;
      }

      state.startLiveSoc = state.currentSoc;

      const btn = document.getElementById('btnTriggerCharge');
      const icon = document.getElementById('iconChargeStatus');
      const txt = document.getElementById('txtBtnCharge');
      const liveStream = document.getElementById('tubeLiveStream');
      const phaseLabel = document.getElementById('txtPhaseLabel');

      btn.classList.add('running');
      icon.innerHTML = `<path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.2" fill="none"/>`;
      txt.innerText = "ŞARJ DEVAM EDİYOR • DURDUR";
      liveStream.classList.add('running');
      phaseLabel.innerText = "Şarj Ediliyor";

      masterTube.style.pointerEvents = 'none';
      durationTube.style.pointerEvents = 'none';

      if (state.alarmActive && state.finishTimestamp) {
        createIcsCalendarAlarm(new Date(state.finishTimestamp));
        showToast("Takvim alarmı indiriliyor...");
      }

      tickRealtimeCharging();
      chargingInterval = setInterval(tickRealtimeCharging, 1000);
    }

    function finishChargeWithLogbook() {
      if (state.tab === 'socToDuration') {
        document.getElementById('endSimText').innerHTML = `Simülatör bu dolumu <strong style="color:var(--ios-orange);">${state.activeSessionPredictedMins}</strong> dakikada tamamlamayı öngördü. Öğrenen algoritmayı eğitmek için gerçekte ne kadar sürdüğünü girin.`;
        document.getElementById('inputActualMins').value = state.activeSessionPredictedMins;
        document.getElementById('endSimUnit').innerText = "dakika sürdü";
      } else {
        document.getElementById('endSimText').innerHTML = `Simülatör ${state.durationMins} dakika sonunda şarjın <strong style="color:var(--ios-orange);">%${state.activeSessionPredictedSoc}</strong> seviyesine ulaşmasını öngördü. Gerçekte yüzde kaçta kaldı?`;
        document.getElementById('inputActualMins').value = state.activeSessionPredictedSoc;
        document.getElementById('endSimUnit').innerText = "yüzdesine ulaştı";
      }
      document.getElementById('modalEndCharge').classList.add('open');
    }

    document.getElementById('btnLogSkip').addEventListener('click', () => {
      document.getElementById('modalEndCharge').classList.remove('open');
      hardStopSession();
    });

    document.getElementById('btnLogSave').addEventListener('click', () => {
      const actualVal = parseInt(document.getElementById('inputActualMins').value, 10);
      if (actualVal && actualVal > 0) {
        let ratio = 1.0;
        let logEntry = {
          date: new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' }),
          start: state.startLiveSoc,
          kw: state.stationKw
        };

        if (state.tab === 'socToDuration') {
          let simMins = state.activeSessionPredictedMins;
          ratio = simMins / actualVal; 
          logEntry.target = state.targetLiveSoc;
          logEntry.sim = simMins + "dk";
          logEntry.act = actualVal + "dk";
        } else {
          let simDelta = state.activeSessionPredictedSoc - state.startLiveSoc;
          let actDelta = actualVal - state.startLiveSoc;
          if (actDelta > 0 && simDelta > 0) {
              ratio = actDelta / simDelta;
          }
          logEntry.target = actualVal;
          logEntry.sim = "%" + state.activeSessionPredictedSoc;
          logEntry.act = "%" + actualVal;
          state.targetLiveSoc = actualVal; 
        }
        
        state.mlFactor = (state.mlFactor * 0.8) + (ratio * 0.2);
        state.mlFactor = Math.max(0.6, Math.min(1.4, state.mlFactor)); 

        state.logbook.unshift(logEntry);
        if (state.logbook.length > 15) state.logbook.pop();
        
        saveState();
        renderLogbook();
        showToast(`Kayıt alındı. Sistem sapması kalibre edildi.`);
      }
      document.getElementById('modalEndCharge').classList.remove('open');
      hardStopSession();
    });

    function hardStopSession() {
      if (chargingInterval) {
        clearInterval(chargingInterval);
        chargingInterval = null;
      }
      state.isChargingRunning = false;

      const btn = document.getElementById('btnTriggerCharge');
      const icon = document.getElementById('iconChargeStatus');
      const txt = document.getElementById('txtBtnCharge');
      const liveStream = document.getElementById('tubeLiveStream');
      const phaseLabel = document.getElementById('txtPhaseLabel');

      btn.classList.remove('running');
      icon.innerHTML = `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>`;
      txt.innerText = "ŞARJI BAŞLAT";
      liveStream.classList.remove('running');
      phaseLabel.innerText = "DC Simülatörü";

      masterTube.style.pointerEvents = 'auto';
      durationTube.style.pointerEvents = 'auto';

      state.currentSoc = state.targetLiveSoc;
      calculate();
    }

    document.getElementById('btnTriggerCharge').addEventListener('click', () => {
      if (state.isChargingRunning) {
        const now = Date.now();
        const passedMs = now - state.startTimestamp;
        const totalExpectedMs = state.finishTimestamp - state.startTimestamp;

        if (passedMs < totalExpectedMs - 5000) { 
           showToast("Erken durduruldu. ML kalibrasyonu pas geçildi.");
           hardStopSession();
        } else {
           finishChargeWithLogbook();
        }
      } else {
        startChargingSession();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && state.isChargingRunning) {
        tickRealtimeCharging();
      }
    });

    const masterTube = document.getElementById('masterTouchTube');
    const floatHud = document.getElementById('tubeFloatHud');

    function handleBatteryBarTouch(clientX) {
      if (state.isChargingRunning) return;
      if (state.tab !== 'socToDuration') {
        state.tab = 'socToDuration';
        document.getElementById('tabSocToDuration').classList.add('active');
        document.getElementById('tabDurationToSoc').classList.remove('active');
      }

      const rect = masterTube.getBoundingClientRect();
      if (!rect || rect.width <= 0) return;

      const clickX = Math.max(0, Math.min(rect.width, clientX - rect.left));
      const touchedPct = Math.max(0, Math.min(100, Math.round((clickX / rect.width) * 100)));

      if (!activeDragHandle) {
        if (touchedPct <= state.currentSoc) activeDragHandle = 'start';
        else if (touchedPct >= state.targetSoc) activeDragHandle = 'target';
        else {
          const dS = Math.abs(touchedPct - state.currentSoc);
          const dT = Math.abs(touchedPct - state.targetSoc);
          activeDragHandle = (dS <= dT) ? 'start' : 'target';
        }
      }

      if (activeDragHandle === 'start') {
        state.currentSoc = Math.max(0, Math.min(state.targetSoc - 1, touchedPct));
        floatHud.innerText = `%${state.currentSoc}`;
      } else {
        state.targetSoc = Math.max(state.currentSoc + 1, Math.min(100, touchedPct));
        floatHud.innerText = `%${state.targetSoc}`;
      }

      floatHud.classList.add('active');
      floatHud.style.left = `${clickX}px`;
      calculate();
    }

    masterTube.addEventListener('pointerdown', (e) => {
      activeDragHandle = null;
      try { masterTube.setPointerCapture(e.pointerId); } catch(err){}
      handleBatteryBarTouch(e.clientX);
    });
    masterTube.addEventListener('pointermove', (e) => {
      if (activeDragHandle) handleBatteryBarTouch(e.clientX);
    });
    const endBatteryDrag = (e) => {
      activeDragHandle = null;
      floatHud.classList.remove('active');
      try { if (masterTube.hasPointerCapture(e.pointerId)) masterTube.releasePointerCapture(e.pointerId); } catch(err){}
    };
    masterTube.addEventListener('pointerup', endBatteryDrag);
    masterTube.addEventListener('pointercancel', endBatteryDrag);

    function updateBatteryBarVisual() {
      const startFill = document.getElementById('tubeStartFill');
      const targetWindow = document.getElementById('tubeTargetWindow');
      const dispStart = document.getElementById('dispCurrentSoc');
      const dispTarget = document.getElementById('dispTargetSoc');
      const txtDelta = document.getElementById('txtBatDeltaSummary');

      dispStart.innerText = `%${state.currentSoc}`;
      dispTarget.innerText = `%${state.targetSoc}`;

      const delta = Math.max(0, state.targetSoc - state.currentSoc);
      const deltaKwh = (delta / 100) * T10F_USABLE_KWH;
      txtDelta.innerText = `+${delta}% • ${deltaKwh.toFixed(1)} kWh`;

      startFill.style.width = `${state.currentSoc}%`;
      targetWindow.style.left = `${state.currentSoc}%`;
      targetWindow.style.width = `${delta}%`;
    }

    const durationTube = document.getElementById('durationTouchTube');

    function handleDurationBarTouch(clientX) {
      if (state.isChargingRunning) return;
      if (state.tab !== 'durationToSoc') {
        state.tab = 'durationToSoc';
        document.getElementById('tabDurationToSoc').classList.add('active');
        document.getElementById('tabSocToDuration').classList.remove('active');
      }

      const rect = durationTube.getBoundingClientRect();
      if (!rect || rect.width <= 0) return;

      const clickX = Math.max(0, Math.min(rect.width, clientX - rect.left));
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      const mins = Math.max(1, Math.min(60, Math.round(ratio * 60)));

      state.durationMins = mins;
      calculate();
    }

    durationTube.addEventListener('pointerdown', (e) => {
      isDurationDragging = true;
      try { durationTube.setPointerCapture(e.pointerId); } catch(err){}
      handleDurationBarTouch(e.clientX);
    });
    durationTube.addEventListener('pointermove', (e) => {
      if (isDurationDragging) handleDurationBarTouch(e.clientX);
    });
    const endDurationDrag = (e) => {
      isDurationDragging = false;
      try { if (durationTube.hasPointerCapture(e.pointerId)) durationTube.releasePointerCapture(e.pointerId); } catch(err){}
    };
    durationTube.addEventListener('pointerup', endDurationDrag);
    durationTube.addEventListener('pointercancel', endDurationDrag);

    function updateDurationTubeVisual(mins) {
      const fill = document.getElementById('durationFill');
      const badge = document.getElementById('dispDurationBadge');
      const pct = Math.max(0, Math.min(100, (mins / 60) * 100));
      fill.style.width = `${pct}%`;
      badge.innerText = `${mins} dk`;
    }

    document.getElementById('tabDurationToSoc').addEventListener('click', () => {
      if (state.isChargingRunning) return;
      state.tab = 'durationToSoc';
      document.getElementById('tabDurationToSoc').classList.add('active');
      document.getElementById('tabSocToDuration').classList.remove('active');
      document.getElementById('lblTargetTitle').innerText = "Ulaşılacak";
      document.getElementById('lblDurationTitle').innerText = "Seçilen Süre (0–60 dk)";
      calculate();
    });

    document.getElementById('tabSocToDuration').addEventListener('click', () => {
      if (state.isChargingRunning) return;
      state.tab = 'socToDuration';
      document.getElementById('tabSocToDuration').classList.add('active');
      document.getElementById('tabDurationToSoc').classList.remove('active');
      document.getElementById('lblTargetTitle').innerText = "Hedef";
      document.getElementById('lblDurationTitle').innerText = "Gereken Süre (Hesaplanan)";
      calculate();
    });

    function updateConditionsSummary() {
      const summaryTag = document.getElementById('conditionsSummaryTag');
      let arr = [];
      arr.push(state.weatherFetched ? `${state.ambientTemp}°C` : "Oto Isı");
      
      if (state.tripProfile === 'cold') arr.push("Yattı");
      else if (state.tripProfile === 'mild') arr.push("Şehir İçi");
      else arr.push("Uzun Yol");

      if (state.secondCarActive) arr.push("Bölünmüş Güç");
      if (state.cabinAcActive) arr.push("Klima");
      
      summaryTag.innerText = arr.join(" • ");
    }

    document.getElementById('rowToggleAlarm').addEventListener('click', () => {
      state.alarmActive = !state.alarmActive;
      const bdg = document.getElementById('condAlarmBadge');
      if (state.alarmActive) {
        bdg.innerText = "Açık";
        bdg.style.color = "var(--ios-orange)";
        bdg.style.background = "rgba(255, 159, 10, 0.18)";
        bdg.style.borderColor = "rgba(255, 159, 10, 0.4)";
      } else {
        bdg.innerText = "Kapalı";
        bdg.style.color = "var(--ios-red)";
        bdg.style.background = "rgba(255, 69, 58, 0.18)";
        bdg.style.borderColor = "rgba(255, 69, 58, 0.4)";
      }
    });

    document.getElementById('rowToggleBalance').addEventListener('click', () => {
      state.balanceTierIdx = (state.balanceTierIdx + 1) % BALANCE_OPTIONS.length;
      document.getElementById('condBalanceBadge').innerText = BALANCE_OPTIONS[state.balanceTierIdx].label;
      calculate();
    });

    function renderLogbook() {
      const container = document.getElementById('logbookList');
      if (state.logbook.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:10px; color:var(--text-tertiary); font-size:11px;">Henüz kayıt yok.</div>`;
        return;
      }
      container.innerHTML = state.logbook.map(l => `
        <div class="alt-item" style="cursor:default;">
          <div class="alt-item-info">
            <span class="alt-item-name">%${l.start} &rarr; %${l.target} (${l.kw} kW)</span>
            <span class="alt-item-sub">${l.date} • Sim: ${l.sim}, Gerçek: ${l.act}</span>
          </div>
        </div>
      `).join('');
    }

    document.querySelectorAll('.ios-chip-btn').forEach(chip => {
      chip.addEventListener('click', () => {
        state.tripProfile = chip.getAttribute('data-trip');
        document.querySelectorAll('.ios-chip-btn').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        updateConditionsSummary();
        calculate();
      });
    });

    const modalConditions = document.getElementById('modalConditions');
    document.getElementById('btnOpenConditionsModal').addEventListener('click', () => {
      document.getElementById('condBalanceBadge').innerText = BALANCE_OPTIONS[state.balanceTierIdx].label;
      renderLogbook();
      modalConditions.classList.add('open');
    });
    document.getElementById('btnCloseConditions').addEventListener('click', () => {
      modalConditions.classList.remove('open');
    });

    document.getElementById('rowToggleSecondCar').addEventListener('click', () => {
      state.secondCarActive = !state.secondCarActive;
      const bdg = document.getElementById('condSecondCarBadge');
      if (state.secondCarActive) {
        bdg.innerText = "Açık";
        bdg.style.color = "var(--ios-orange)";
        bdg.style.background = "rgba(255, 159, 10, 0.18)";
        bdg.style.borderColor = "rgba(255, 159, 10, 0.4)";
      } else {
        bdg.innerText = "Kapalı";
        bdg.style.color = "var(--ios-red)";
        bdg.style.background = "rgba(255, 69, 58, 0.18)";
        bdg.style.borderColor = "rgba(255, 69, 58, 0.4)";
      }
      updateConditionsSummary();
      calculate();
    });

    document.getElementById('rowToggleCabin').addEventListener('click', () => {
      state.cabinAcActive = !state.cabinAcActive;
      const bdg = document.getElementById('condCabinBadge');
      if (state.cabinAcActive) {
        bdg.innerText = "Açık";
        bdg.style.color = "var(--ios-orange)";
        bdg.style.background = "rgba(255, 159, 10, 0.18)";
        bdg.style.borderColor = "rgba(255, 159, 10, 0.4)";
      } else {
        bdg.innerText = "Kapalı";
        bdg.style.color = "var(--ios-red)";
        bdg.style.background = "rgba(255, 69, 58, 0.18)";
        bdg.style.borderColor = "rgba(255, 69, 58, 0.4)";
      }
      updateConditionsSummary();
      calculate();
    });

    function applyStation(st) {
      state.currentStation = st;
      state.isAutoStationBound = true;

      const bar = document.getElementById('nearestStationBar');
      bar.classList.add('active-bind');

      document.getElementById('dispNearestName').innerText = st.name;
      document.getElementById('dispNearestMeta').innerText = `${st.city || "Eskişehir"} • ${st.dist} km`;
      document.getElementById('dispNearestKw').innerText = `${st.kw} kW`;

      syncKwSelection(st.kw);
    }

    function syncKwSelection(kw) {
      state.stationKw = kw;
      document.getElementById('btnCustomPower').classList.remove('selected');
      document.getElementById('customInputWrap').classList.remove('open');
      document.getElementById('customValBadgeWrap').style.display = 'flex';

      let matched = false;
      document.querySelectorAll('.kw-btn').forEach(btn => {
        const bKw = parseInt(btn.getAttribute('data-kw'), 10);
        const match = (bKw === kw);
        btn.classList.toggle('selected', match);
        btn.classList.toggle('locked-by-gps', state.isAutoStationBound);
        if (match) matched = true;
      });

      document.getElementById('btnCustomPower').classList.toggle('locked-by-gps', state.isAutoStationBound);

      if (!matched && state.isAutoStationBound) {
        document.querySelectorAll('.kw-btn').forEach(b => b.classList.remove('selected'));
        const cb = document.getElementById('btnCustomPower');
        cb.classList.add('selected');
        document.getElementById('dispCustomKwVal').innerText = kw;
        document.getElementById('inputCustomKw').value = kw;
      }

      calculate();
    }

    document.getElementById('nearestStationBar').addEventListener('click', () => {
      if (state.isAutoStationBound) {
        state.isAutoStationBound = false;
        document.getElementById('nearestStationBar').classList.remove('active-bind');
        document.querySelectorAll('.kw-btn').forEach(b => b.classList.remove('locked-by-gps'));
        document.getElementById('btnCustomPower').classList.remove('locked-by-gps');
        showToast("İstasyon kilidi kaldırıldı: Manuel güç seçebilirsiniz.");
      } else if (state.currentStation) {
        applyStation(state.currentStation);
        showToast("İstasyon otomatik kilitlendi.");
      }
    });

    document.querySelectorAll('.kw-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.isAutoStationBound) {
          showToast(`İstasyon kilitli. Değiştirmek için üstteki karta dokunun.`);
          return;
        }
        const kw = parseInt(btn.getAttribute('data-kw'), 10);
        document.querySelectorAll('.kw-btn').forEach(b => b.classList.toggle('selected', b === btn));
        document.getElementById('btnCustomPower').classList.remove('selected');
        state.stationKw = kw;
        calculate();
      });
    });

    const customBar = document.getElementById('btnCustomPower');
    const customInputWrap = document.getElementById('customInputWrap');
    const customValBadgeWrap = document.getElementById('customValBadgeWrap');
    const inputCustomKw = document.getElementById('inputCustomKw');

    customBar.addEventListener('click', () => {
      if (state.isAutoStationBound) {
        showToast("İstasyon kilitli. Manuel güç için üstteki karta dokunun.");
        return;
      }
      document.querySelectorAll('.kw-btn').forEach(b => b.classList.remove('selected'));
      customBar.classList.add('selected');
      customValBadgeWrap.style.display = 'none';
      customInputWrap.classList.add('open');
      inputCustomKw.focus();
    });

    inputCustomKw.addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10);
      if (v > 0) {
        state.stationKw = v;
        document.getElementById('dispCustomKwVal').innerText = v;
        calculate();
      }
    });

    inputCustomKw.addEventListener('blur', () => {
      customInputWrap.classList.remove('open');
      customValBadgeWrap.style.display = 'flex';
    });

    function renderStationList() {
      const sorted = REAL_DC_STATIONS.map(st => ({
        ...st,
        dist: parseFloat(calcDist(state.userCoords.lat, state.userCoords.lon, st.lat, st.lon))
      })).sort((a, b) => a.dist - b.dist);

      applyStation(sorted[0]);

      const container = document.getElementById('altListContainer');
      container.innerHTML = sorted.map(s => `
        <div class="alt-item" onclick="selectStationFromSheet('${s.id}')">
          <div class="alt-item-info">
            <span class="alt-item-name">${s.name}</span>
            <span class="alt-item-sub">${s.city || "Eskişehir"} • ${s.dist} km</span>
          </div>
          <span class="alt-item-kw">${s.kw} kW</span>
        </div>
      `).join('');
    }

    window.selectStationFromSheet = function(id) {
      const found = REAL_DC_STATIONS.find(s => s.id === id);
      if (found) {
        applyStation({ ...found, dist: calcDist(state.userCoords.lat, state.userCoords.lon, found.lat, found.lon) });
        document.getElementById('modalAltStations').classList.remove('open');
        showToast(`${found.name} seçildi`);
      }
    };

    const modalAlt = document.getElementById('modalAltStations');
    document.getElementById('btnOpenAltSheet').addEventListener('click', (e) => {
      e.stopPropagation();
      modalAlt.classList.add('open');
    });

    document.getElementById('btnCloseAltSheet').addEventListener('click', () => {
      modalAlt.classList.remove('open');
    });

    modalAlt.addEventListener('click', (e) => {
      if (e.target === modalAlt) modalAlt.classList.remove('open');
    });

    document.getElementById('btnRefreshGps').addEventListener('click', () => {
      showToast("Konum taranıyor...");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          state.userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          renderStationList();
          fetchWeather(state.userCoords.lat, state.userCoords.lon);
        }, () => renderStationList());
      } else {
        renderStationList();
      }
    });

    window.addEventListener('load', () => {
      loadState();

      setTimeout(() => {
        const s = document.getElementById('splashScreen');
        if (s) {
          s.style.opacity = '0';
          setTimeout(() => s.style.visibility = 'hidden', 400);
        }
      }, 700);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          state.userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          renderStationList();
          fetchWeather(state.userCoords.lat, state.userCoords.lon);
        }, () => {
          renderStationList();
          fetchWeather(state.userCoords.lat, state.userCoords.lon);
        });
      } else {
        renderStationList();
        fetchWeather(state.userCoords.lat, state.userCoords.lon);
      }
      
      updateConditionsSummary();
      calculate();
    });
  <@/script>
</body>
</html></script>

  <script>
  (function () {
    'use strict';

    const MODES = ['ac', 'dc'];
    const SRC = {};
    MODES.forEach(m => {
      /* Kaynaktaki bazı özel diziler güvenli işaretlendi; burada geri çevrilir */
      SRC[m] = document.getElementById('src-' + m).textContent.split('<@').join('<');
    });

    /* Orijinal koda dokunmadan, çalışma anında eklenen küçük katman:
       - kendi açılış ekranını gizle (birleşik açılış zaten oynadı)
       - "ReadyAt" yanına tıklanabilir AC/DC etiketi ekle */
    const THEME = {
      ac: { fg: '#5ac8fa', bg: 'rgba(10,132,255,0.22)', bd: 'rgba(10,132,255,0.45)' },
      dc: { fg: '#ff9f0a', bg: 'rgba(255,159,10,0.22)', bd: 'rgba(255,159,10,0.45)' }
    };

    function headInject(mode) {
      const t = THEME[mode];
      return '\n<style id="ra-shell-style">' +
        '.splash-screen{display:none!important}' +
        'html{min-height:100vh;min-height:100dvh;background:#030407}body{min-height:100vh;min-height:100dvh}' +
        '.header-ac-subbadge,.header-dc-subbadge{display:none!important}' +
        '.ra-chip{-webkit-appearance:none;appearance:none;position:relative;display:inline-flex;align-items:center;gap:3px;' +
          'margin:0;padding:0 5px 0 6px;height:16px;border-radius:6px;cursor:pointer;flex-shrink:0;' +
          'font:800 9.5px/14px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;letter-spacing:.5px;' +
          'color:' + t.fg + ';background:' + t.bg + ';border:1px solid ' + t.bd + ';transition:transform .15s ease,filter .2s ease}' +
        '.ra-chip:active{transform:scale(.9);filter:brightness(1.25)}' +
        '.ra-chip::before{content:"";position:absolute;inset:-10px -8px}' +
        '.ra-chip svg{width:7px;height:7px;display:block;opacity:.85}' +
        '@media(max-width:400px){.ra-chip{padding:0 5px;gap:0}.ra-chip svg{display:none}}' +
        '</style>\n';
    }

    function bodyInject(mode) {
      return '\n<scr' + 'ipt id="ra-shell-script">(function(){' +
        'try{' +
        'var row=document.querySelector(".brand-title-row");if(!row)return;' +
        'var b=document.createElement("button");b.type="button";b.className="ra-chip";b.setAttribute("aria-label","Şarj modunu değiştir");' +
        'b.innerHTML=\'' + mode.toUpperCase() + '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"/></svg>\';' +
        'b.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();' +
          'try{window.parent.postMessage({type:"readyat-open-switcher",mode:"' + mode + '"},"*");}catch(_){}});' +
        'row.appendChild(b);' +
        '}catch(e){}})();<\/script>\n';
    }

    function buildDoc(mode) {
      let h = SRC[mode];
      const hi = h.indexOf('</head>');
      if (hi !== -1) h = h.slice(0, hi) + headInject(mode) + h.slice(hi);
      const bi = h.lastIndexOf('</body>');
      if (bi !== -1) h = h.slice(0, bi) + bodyInject(mode) + h.slice(bi);
      return h;
    }

    const frames = { ac: document.getElementById('frame-ac'), dc: document.getElementById('frame-dc') };
    const loaded = {};
    let activeMode = null;

    function ensureFrame(mode) {
      if (!loaded[mode]) {
        loaded[mode] = new Promise(resolve => {
          const f = frames[mode];
          f.addEventListener('load', () => resolve(), { once: true });
          f.srcdoc = buildDoc(mode);
        });
      }
      return loaded[mode];
    }

    function showFrame(mode) {
      MODES.forEach(m => frames[m].classList.toggle('on', m === mode));
      activeMode = mode;
      try { document.title = 'ReadyAt • ' + mode.toUpperCase(); } catch (e) {}
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));

    /* ---------- Açılış sahnesi ---------- */
    const stage = document.getElementById('stage');
    let picking = false;

    function startStage() { setTimeout(() => stage.classList.add('ready'), 2100); }
    if (document.readyState === 'complete') startStage();
    else window.addEventListener('load', startStage);

    stage.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (picking || !stage.classList.contains('ready')) return;
        picking = true;
        const mode = btn.dataset.mode;
        try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
        stage.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.add(b === btn ? 'chosen' : 'other');
        });
        stage.classList.add('picked');
        await Promise.all([ensureFrame(mode), wait(650)]);
        showFrame(mode);
        await wait(120);
        stage.classList.add('gone');
        setTimeout(() => { stage.style.display = 'none'; }, 800);
      });
    });

    /* ---------- Mod değiştirme pop-up ---------- */
    const switcher = document.getElementById('switcher');
    const swBtns = Array.from(switcher.querySelectorAll('.mode-btn'));
    let switching = false;

    function openSwitcher() {
      swBtns.forEach(b => {
        b.classList.toggle('current', b.dataset.mode === activeMode);
        b.classList.remove('loading');
      });
      switcher.classList.add('open');
    }
    function closeSwitcher() { switcher.classList.remove('open'); }

    window.addEventListener('message', e => {
      const d = e.data;
      if (d && d.type === 'readyat-open-switcher' && activeMode && !switching) openSwitcher();
    });

    switcher.addEventListener('click', async e => {
      if (e.target === switcher) { closeSwitcher(); return; }
      const btn = e.target.closest('.mode-btn');
      if (!btn || switching) return;
      const mode = btn.dataset.mode;
      if (mode === activeMode) { closeSwitcher(); return; }
      switching = true;
      try { navigator.vibrate && navigator.vibrate(10); } catch (err) {}
      btn.classList.add('loading');
      await Promise.all([ensureFrame(mode), wait(350)]);
      showFrame(mode);
      closeSwitcher();
      switching = false;
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSwitcher(); });
  })();
  </script>
</body>
</html>
